<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tullee and Spring — Ode to Tullee</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#120e0a;
  font-family:Georgia,serif;
}
canvas{display:block;touch-action:none}

#heading{
  position:fixed;top:18px;left:22px;z-index:5;
  color:#eee4d3;font:13px Arial,sans-serif;
  letter-spacing:2px;text-shadow:0 2px 5px #000;
}
#hint{
  position:fixed;bottom:18px;left:50%;
  transform:translateX(-50%);z-index:5;
  color:#eee4d3;background:#211c17cc;
  padding:10px 16px;border-radius:20px;
  font:12px Arial,sans-serif;text-align:center;
}
#enter{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:#0c0907e0;padding:20px;
}
#enterCard{
  background:#241d15;border:1px solid #b49a70;
  color:#f1e6d5;padding:35px;text-align:center;
  max-width:400px;
}
#enterCard h1{font-weight:normal;letter-spacing:2px}
button{
  background:#665039;color:#fff1dc;
  border:1px solid #c2a77c;border-radius:22px;
  padding:12px 22px;cursor:pointer;font-size:14px;
}
#poemModal{
  display:none;position:fixed;inset:0;z-index:20;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;isolation:isolate;
  background:#080706f5;padding:68px 16px 64px;
}
#closePoem{
  position:fixed;top:16px;right:16px;z-index:21;
}
#poemImage{
  display:block;width:auto;max-width:92vw;height:auto;
  margin:0 auto;transform:translateZ(0);
}
#touchControls{
  display:none;position:fixed;bottom:60px;left:15px;
  z-index:6;gap:8px;
}
#touchControls button{
  width:48px;height:48px;padding:0;border-radius:50%;
}
@media(pointer:coarse){
  #touchControls{display:flex}
  #hint{
    left:auto;right:10px;transform:none;
    max-width:48vw;
  }
}
</style>
</head>

<body>

<div id="heading">TULLEE AND SPRING · ODE TO TULLEE</div>
<div id="hint">WASD or arrows to walk · Drag to look · Click poem to enlarge</div>

<div id="touchControls">
  <button data-move="forward">↑</button>
  <button data-move="back">↓</button>
  <button data-move="left">←</button>
  <button data-move="right">→</button>
</div>

<div id="enter">
  <div id="enterCard">
    <h1>Tullee and Spring</h1>
    <p>Ode to Tullee</p>
    <button id="enterButton">ENTER ROOM</button>
  </div>
</div>

<div id="poemModal">
  <button id="closePoem">Close poem</button>
  <img id="poemImage"
       src="assets/poems/Ode%20to%20Tullee.png?v=1"
       alt="Ode to Tullee poem">
</div>

<audio id="roomSong" src="assets/music/Ode%20to%20Tullee.mp3"
       preload="auto" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(()=>{
'use strict';

/* SCENE */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x120e0a);

const camera=new THREE.PerspectiveCamera(
  62,innerWidth/innerHeight,.1,100
);
camera.position.set(0,1.65,4.5);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.72;
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);


/* ROOM: 14 x 12 FEET */

const room=new THREE.Group();
scene.add(room);

const wallMat=new THREE.MeshStandardMaterial({
  color:0x827767,roughness:.95
});
const sideMat=new THREE.MeshStandardMaterial({
  color:0x665b4c,roughness:.95
});
const ceilingMat=new THREE.MeshStandardMaterial({
  color:0x9b907e,roughness:1
});

function panel(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),mat
  );
  m.position.set(x,y,z);
  room.add(m);
  return m;
}


/* HARDWOOD FLOOR - PRESERVED */

const floorTexture=new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/hardwood2_diffuse.jpg"
);
floorTexture.colorSpace=THREE.SRGBColorSpace;
floorTexture.wrapS=THREE.RepeatWrapping;
floorTexture.wrapT=THREE.RepeatWrapping;
floorTexture.repeat.set(5,4);

const floorMat=new THREE.MeshStandardMaterial({
  map:floorTexture,roughness:.62
});

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(14,12),floorMat
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
room.add(floor);


/* WALLS AND CEILING */

panel(14,.2,12,ceilingMat,0,6.5,0);
panel(14,6.4,.2,wallMat,0,3.2,-6);
panel(.2,6.4,12,sideMat,-7,3.2,0);
panel(.2,6.4,12,sideMat,7,3.2,0);

/* Open entrance */

panel(5.3,6.4,.2,sideMat,-4.35,3.2,6);
panel(5.3,6.4,.2,sideMat,4.35,3.2,6);
panel(3.4,.8,.2,sideMat,0,6,6);


/* DIMMER, WARMER LIGHTING */

scene.add(new THREE.HemisphereLight(
  0xffedda,0x3a3026,.22
));

const mainLight=new THREE.DirectionalLight(
  0xffe5c4,.22
);
mainLight.position.set(-3,6,4);
scene.add(mainLight);

const roomLight=new THREE.PointLight(
  0xffd9a6,5.5,17,2
);
roomLight.position.set(0,4.8,0);
scene.add(roomLight);

const photoLight=new THREE.PointLight(
  0xffe5bd,13,10,2
);
photoLight.position.set(-2.5,4.8,-3.8);
scene.add(photoLight);

const poemLight=new THREE.PointLight(
  0xffe5c4,6,8,2
);
poemLight.position.set(2.7,4.5,-3.5);
scene.add(poemLight);


/* IMAGE FRAMES */

const frameMat=new THREE.MeshStandardMaterial({
  color:0x493723,roughness:.5
});

const imageMaterial=new THREE.MeshBasicMaterial({
  color:0xffffff,side:THREE.DoubleSide,transparent:true
});

function framedImage(src,x,y,maxW,maxH){

  const group=new THREE.Group();
  group.position.set(x,y,-5.78);
  room.add(group);

  const image=new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),imageMaterial.clone()
  );
  image.position.z=.16;
  image.renderOrder=3;
  group.add(image);

  const mat=image.material;
  let frameParts=[];

  function resizeFrame(w,h){

    image.geometry.dispose();
    image.geometry=new THREE.PlaneGeometry(w,h);

    frameParts.forEach(p=>{
      group.remove(p);
      p.geometry.dispose();
    });
    frameParts=[];

    const backing=new THREE.Mesh(
      new THREE.BoxGeometry(w+.28,h+.28,.16),frameMat
    );
    group.add(backing);
    frameParts.push(backing);

    function bar(bw,bh,bx,by){
      const p=new THREE.Mesh(
        new THREE.BoxGeometry(bw,bh,.12),frameMat
      );
      p.position.set(bx,by,.045);
      group.add(p);
      frameParts.push(p);
    }

    bar(w+.12,.10,0,h/2+.02);
    bar(w+.12,.10,0,-h/2-.02);
    bar(.10,h, w/2+.02,0);
    bar(.10,h,-w/2-.02,0);

    image.position.z=.16;
  }

  new THREE.TextureLoader().load(
    src,
    texture=>{
      texture.colorSpace=THREE.SRGBColorSpace;
      mat.map=texture;
      mat.needsUpdate=true;

      const aspect=texture.image.width/texture.image.height;
      let w=maxW;
      let h=w/aspect;

      if(h>maxH){
        h=maxH;
        w=h*aspect;
      }

      resizeFrame(w,h);
      console.log("Loaded image:",src);
    },
    undefined,
    error=>{
      console.error("Image failed to load:",src,error);
    }
  );

  return {group,image};
}


/* ODE TO TULLEE PHOTO */

const photo=framedImage(
  "assets/photos/Ode%20to%20Tullee.jpg",
  -2.55,3.1,4.7,3.4
);


/* ODE TO TULLEE POEM */

const poem=framedImage(
  "assets/poems/Ode%20to%20Tullee.png?v=1",
  2.65,3.1,3.0,4.2
);


/* MOVEMENT */

const keys={};
const held={
  forward:false,back:false,left:false,right:false
};

let yaw=0;
let pitch=0;
let dragging=false;
let lastX=0,lastY=0;
let entered=false;
let modalOpenedAt=0;

const clock=new THREE.Clock();

function update(dt){

  const turn=.85*dt;
  const speed=1.4*dt;

  if(keys.ArrowLeft||keys.KeyA||held.left)yaw+=turn;
  if(keys.ArrowRight||keys.KeyD||held.right)yaw-=turn;

  let forward=0;
  if(keys.KeyW||keys.ArrowUp||held.forward)forward+=speed;
  if(keys.KeyS||keys.ArrowDown||held.back)forward-=speed;

  camera.position.x-=Math.sin(yaw)*forward;
  camera.position.z-=Math.cos(yaw)*forward;

  camera.position.x=THREE.MathUtils.clamp(
    camera.position.x,-5.8,5.8
  );
  camera.position.z=THREE.MathUtils.clamp(
    camera.position.z,-4.8,4.8
  );

  camera.rotation.set(pitch,yaw,0,'YXZ');
}

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);


/* LOOK AROUND (MOUSE + TOUCH) */

renderer.domElement.addEventListener('pointerdown',e=>{
  if(!entered)return;
  if(e.target.closest('#touchControls'))return;

  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  yaw-=dx*.0018;
  pitch=THREE.MathUtils.clamp(
    pitch+dy*.0015,-.65,.65
  );

  lastX=e.clientX;
  lastY=e.clientY;
});

function endDrag(e){
  if(!dragging)return;
  dragging=false;
  if(e&&renderer.domElement.hasPointerCapture(e.pointerId)){
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
}

renderer.domElement.addEventListener('pointerup',endDrag);
renderer.domElement.addEventListener('pointercancel',endDrag);


/* TOUCH BUTTONS */

document.querySelectorAll('[data-move]').forEach(b=>{
  const direction=b.dataset.move;

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    held[direction]=true;
  });

  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    b.addEventListener(ev,()=>held[direction]=false);
  });
});


/* CLICK POEM TO ENLARGE */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const poemModal=document.getElementById('poemModal');

renderer.domElement.addEventListener('click',e=>{

  if(!entered||poemModal.style.display==='block')return;

  pointer.x=e.clientX/innerWidth*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(pointer,camera);

  if(raycaster.intersectObject(poem.image).length){
    modalOpenedAt=performance.now();
    poemModal.style.display='block';
    poemModal.scrollTop=0;
  }
});

document.getElementById('closePoem').addEventListener('click',()=>{
  poemModal.style.display='none';
});

poemModal.addEventListener('click',e=>{
  if(e.target===poemModal&&performance.now()-modalOpenedAt>180){
    poemModal.style.display='none';
  }
});


/* MUSIC */

const song=document.getElementById('roomSong');
song.loop=true;

document.getElementById('enterButton').addEventListener('click',()=>{

  entered=true;
  document.getElementById('enter').style.display='none';

  song.play().catch(()=>{
    document.getElementById('hint').textContent=
      'Tap ENTER again to start the music if playback is blocked.';
  });
});


/* ANIMATION */

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(entered)update(dt);
  renderer.render(scene,camera);
}
animate();


/* RESIZE */

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
