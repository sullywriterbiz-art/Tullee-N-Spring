<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natural Gallery 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#ddd2c2;font-family:Georgia,serif}#app{height:100%}#hud{position:fixed;top:16px;left:16px;z-index:3;background:#201c18dd;color:#f5efe5;padding:13px 16px;border-radius:9px;font:13px system-ui;line-height:1.45}#info{display:none;position:fixed;right:18px;top:18px;z-index:4;width:310px;background:#f8f3eaf5;color:#29231e;padding:20px;border-radius:10px;font:14px system-ui;line-height:1.55}#info h2{font-family:Georgia;margin-top:0}button{border:0;border-radius:20px;padding:9px 15px;background:#29231e;color:white}#prompt{display:none;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:4;background:#201c18e8;color:white;padding:11px 18px;border-radius:22px;font:14px system-ui}</style></head><body><div id="app"></div><div id="hud"><b>NATURAL GALLERY</b><br>12 rooms · Room 1 open<br>Click/drag to look · WASD/arrows to walk<br>Approach a doorway and click to enter.</div><div id="prompt"></div><div id="info"><h2 id="title"></h2><div id="copy"></div><br><button onclick="document.getElementById('info').style.display='none'">Return to Gallery</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const rooms=Array.from({length:12},(_,i)=>({id:i+1,open:i===0}));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xded4c6);scene.fog=new THREE.Fog(0xded4c6,22,110);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200);camera.position.set(0,1.7,34);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff5e6,0x51463b,1.8));const sun=new THREE.DirectionalLight(0xffe2bd,2.2);sun.position.set(-15,28,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const M={floor:new THREE.MeshStandardMaterial({color:0x927052,roughness:.78}),wall:new THREE.MeshStandardMaterial({color:0xe7dfd4,roughness:.9}),dark:new THREE.MeshStandardMaterial({color:0x4d463f,roughness:.9}),wood:new THREE.MeshStandardMaterial({color:0x644831,roughness:.72}),stone:new THREE.MeshStandardMaterial({color:0x716c63,roughness:.96}),leaf:new THREE.MeshStandardMaterial({color:0x566448,roughness:.92}),trunk:new THREE.MeshStandardMaterial({color:0x59422f,roughness:1}),brass:new THREE.MeshStandardMaterial({color:0x9a8150,metalness:.65,roughness:.3}),paper:new THREE.MeshStandardMaterial({color:0xf2e9db,roughness:1}),frame:new THREE.MeshStandardMaterial({color:0x3b3028,roughness:.5}),locked:new THREE.MeshStandardMaterial({color:0x765b4b,roughness:.7})};
function box(x,y,z,a,b,c,m){const o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function cyl(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.88,h,10),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o)}function ico(x,y,z,r,m){const o=new THREE.Mesh(new THREE.IcosahedronGeometry(r,2),m);o.position.set(x,y,z);o.scale.y=.82;o.castShadow=true;o.receiveShadow=true;scene.add(o)}
function tree(x,z,s=1){cyl(x,2.2*s,z,.38*s,4.4*s,M.trunk);for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ico(x+Math.cos(a)*.9*s,4.2*s+(i%2)*.45*s,z+Math.sin(a)*.9*s,1.25*s,M.leaf)}cyl(x,.45,z,1.25*s,.7*s,M.stone)}function rock(x,z,s=1){ico(x,.55*s,z,1.05*s,M.stone)}
box(0,-.18,0,34,.35,78,M.floor);box(0,4,-39,34,8,.5,M.dark);box(-17,4,0,.5,8,78,M.wall);box(17,4,0,.5,8,78,M.wall);
const zs=[-30,-18,-6,6,18,30];zs.forEach((z,row)=>{for(const side of [-1,1]){const x=side*10;box(x,4,z-5.2,13,.35,.5,M.wall);box(x,4,z+5.2,13,.35,.5,M.wall);box(side*16.5,4,z,.5,8,10.4,M.wall);const open=(side<0&&row===0);box(side*3.25,3,z,.35,5.8,2.7,open?M.brass:M.locked);box(side*10,3.2,z-2.2,.12,3.1,4.2,M.frame);box(side*9.9,3.2,z-2.2,.14,2.75,3.85,M.paper);const L=new THREE.PointLight(0xffdfb2,3,12,2);L.position.set(side*10,5.6,z);scene.add(L)}});
box(0,.01,-1,10,.08,16,M.stone);tree(0,-3,1.05);tree(-3,1,.72);tree(3,1,.72);rock(-4,-3,1.1);rock(4,5,.9);rock(-4,6,.7);rock(4,-7,.75);for(const z of[-24,0,24]){box(0,.65,z,4,.25,.65,M.wood);box(-1.5,.32,z,.22,.65,.22,M.wood);box(1.5,.32,z,.22,.65,.22,M.wood)}
let yaw=0,pitch=0,drag=false,lx=0,ly=0;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch-=(e.clientY-ly)*.003;pitch=Math.max(-1.25,Math.min(1.25,pitch));lx=e.clientX;ly=e.clientY});
function near(){let best=null,d=99;zs.forEach((z,row)=>[-1,1].forEach(side=>{const q=Math.hypot(camera.position.x-side*3.25,camera.position.z-z);if(q<d&&q<3.3)best={id:row+(side>0?7:1),open:side<0&&row===0},d=q}));return best}
const prompt=document.getElementById('prompt');renderer.domElement.onclick=()=>{const n=near();if(!n)return;if(!n.open){prompt.textContent='Coming Soon — this room is not open yet.';prompt.style.display='block';setTimeout(()=>prompt.style.display='none',1300);return}document.getElementById('title').textContent='Room 1';document.getElementById('copy').innerHTML='<b>Photograph:</b> PHOTO_ROOM_1<br><b>Poem:</b> POEM_ROOM_1<br><b>Song:</b> SONG_ROOM_1<br><br>This is the placeholder content area. Your photograph, poem and song can be added later. The final room interaction can start its song from the visitor’s tap/click, respecting browser audio rules.';document.getElementById('info').style.display='block'};
function animate(){requestAnimationFrame(animate);const v=new THREE.Vector3();if(keys.w||keys.arrowup)v.z-=1;if(keys.s||keys.arrowdown)v.z+=1;if(keys.a||keys.arrowleft)v.x-=1;if(keys.d||keys.arrowright)v.x+=1;if(v.lengthSq()){v.normalize();const s=Math.sin(yaw),c=Math.cos(yaw);camera.position.x+=(v.x*c-v.z*s)*.085;camera.position.z+=(v.x*s+v.z*c)*.085}camera.position.x=Math.max(-15.5,Math.min(15.5,camera.position.x));camera.position.z=Math.max(-36,Math.min(36,camera.position.z));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const n=near();if(n&&document.getElementById('info').style.display!=='block'){prompt.textContent=n.open?'Enter Room 1':'Room '+n.id+' · Coming Soon';prompt.style.display='block'}else if(!n)prompt.style.display='none';renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();</script></body></html>
