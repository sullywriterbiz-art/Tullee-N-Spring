<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natural Gallery 3D</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#ddd2c2;
  font-family:Georgia,serif
}

#app{height:100%}

#hud{
  position:fixed;
  top:16px;
  left:16px;
  z-index:3;
  background:#201c18dd;
  color:#f5efe5;
  padding:13px 16px;
  border-radius:9px;
  font:13px system-ui;
  line-height:1.45
}

#prompt{
  display:none;
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:4;
  background:#201c18e8;
  color:white;
  padding:11px 18px;
  border-radius:22px;
  font:14px system-ui;
  white-space:nowrap
}

#roomTitle{
  display:none;
  position:fixed;
  top:18px;
  right:18px;
  z-index:4;
  background:#f8f3eaf5;
  color:#29231e;
  padding:12px 17px;
  border-radius:9px;
  font:14px system-ui
}

#back{
  display:none;
  position:fixed;
  bottom:25px;
  right:25px;
  z-index:5;
  border:0;
  border-radius:22px;
  padding:10px 17px;
  background:#29231e;
  color:white;
  font:14px system-ui
}
</style>
</head>

<body>

<div id="app"></div>

<div id="hud">
<b>NATURAL GALLERY</b><br>
12 rooms · Room 1 open<br>
Click/drag to look · WASD/arrows to walk<br>
Approach a doorway and click to enter.
</div>

<div id="prompt"></div>
<div id="roomTitle">ROOM 1 · THE FIRST MEETING</div>
<button id="back">← Return to Gallery</button>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* -------------------------
   SCENE
------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xded4c6);

scene.fog = new THREE.Fog(
  0xded4c6,
  22,
  110
);


const camera = new THREE.PerspectiveCamera(
  68,
  innerWidth / innerHeight,
  .1,
  200
);

camera.position.set(0,1.7,34);


const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.05;

document
.getElementById('app')
.appendChild(renderer.domElement);


/* -------------------------
   LIGHT
------------------------- */

scene.add(
  new THREE.HemisphereLight(
    0xfff5e6,
    0x51463b,
    1.8
  )
);

const sun =
new THREE.DirectionalLight(
  0xffe2bd,
  2.2
);

sun.position.set(
  -15,28,18
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,2048
);

scene.add(sun);


/* -------------------------
   MATERIALS
------------------------- */

const M={

floor:
new THREE.MeshStandardMaterial({
color:0x927052,
roughness:.78
}),

wall:
new THREE.MeshStandardMaterial({
color:0xe7dfd4,
roughness:.9
}),

dark:
new THREE.MeshStandardMaterial({
color:0x4d463f,
roughness:.9
}),

wood:
new THREE.MeshStandardMaterial({
color:0x644831,
roughness:.72
}),

stone:
new THREE.MeshStandardMaterial({
color:0x716c63,
roughness:.96
}),

leaf:
new THREE.MeshStandardMaterial({
color:0x566448,
roughness:.92
}),

trunk:
new THREE.MeshStandardMaterial({
color:0x59422f,
roughness:1
}),

brass:
new THREE.MeshStandardMaterial({
color:0x9a8150,
metalness:.65,
roughness:.3
}),

paper:
new THREE.MeshStandardMaterial({
color:0xf2e9db,
roughness:1
}),

frame:
new THREE.MeshStandardMaterial({
color:0x3b3028,
roughness:.5
}),

locked:
new THREE.MeshStandardMaterial({
color:0x765b4b,
roughness:.7
}),

roomFloor:
new THREE.MeshStandardMaterial({
color:0x7d624d,
roughness:.8
}),

roomWall:
new THREE.MeshStandardMaterial({
color:0xe9e1d6,
roughness:.88
}),

art:
new THREE.MeshStandardMaterial({
color:0xc9b59c,
roughness:.9
})

};


/* -------------------------
   HELPERS
------------------------- */

function box(
 x,y,z,
 a,b,c,
 material
){

 const o=new THREE.Mesh(
   new THREE.BoxGeometry(a,b,c),
   material
 );

 o.position.set(x,y,z);

 o.castShadow=true;
 o.receiveShadow=true;

 scene.add(o);

 return o;
}


function cyl(
 x,y,z,
 r,h,
 material
){

 const o=new THREE.Mesh(
   new THREE.CylinderGeometry(
     r,r*.88,h,10
   ),
   material
 );

 o.position.set(x,y,z);

 o.castShadow=true;
 o.receiveShadow=true;

 scene.add(o);

 return o;
}


function ico(
 x,y,z,
 r,
 material
){

 const o=new THREE.Mesh(
   new THREE.IcosahedronGeometry(
     r,2
   ),
   material
 );

 o.position.set(x,y,z);

 o.scale.y=.82;

 o.castShadow=true;
 o.receiveShadow=true;

 scene.add(o);

 return o;
}


/* -------------------------
   NATURE
------------------------- */

function tree(x,z,s=1){

 cyl(
   x,
   2.2*s,
   z,
   .38*s,
   4.4*s,
   M.trunk
 );

 for(
   let i=0;
   i<7;
   i++
 ){

   const a=
     i*Math.PI*2/7;

   ico(
     x+Math.cos(a)*.9*s,
     4.2*s+(i%2)*.45*s,
     z+Math.sin(a)*.9*s,
     1.25*s,
     M.leaf
   );
 }

 cyl(
   x,
   .45,
   z,
   1.25*s,
   .7*s,
   M.stone
 );
}


function rock(x,z,s=1){

 ico(
   x,
   .55*s,
   z,
   1.05*s,
   M.stone
 );
}


/* -------------------------
   MAIN GALLERY
------------------------- */

box(
 0,-.18,0,
 34,.35,78,
 M.floor
);

box(
 0,4,-39,
 34,8,.5,
 M.dark
);

box(
 -17,4,0,
 .5,8,78,
 M.wall
);

box(
 17,4,0,
 .5,8,78,
 M.wall
);


const zs=[
 -30,
 -18,
 -6,
 6,
 18,
 30
];


zs.forEach(
 (z,row)=>{

   for(
     const side of [-1,1]
   ){

     const x=side*10;

     box(
       x,4,z-5.2,
       13,.35,.5,
       M.wall
     );

     box(
       x,4,z+5.2,
       13,.35,.5,
       M.wall
     );

     box(
       side*16.5,
       4,
       z,
       .5,8,10.4,
       M.wall
     );


     const open=
       side<0 &&
       row===0;


     box(
       side*3.25,
       3,
       z,
       .35,
       5.8,
       2.7,
       open ? M.brass : M.locked
     );


     box(
       side*10,
       3.2,
       z-2.2,
       .12,
       3.1,
       4.2,
       M.frame
     );


     box(
       side*9.9,
       3.2,
       z-2.2,
       .14,
       2.75,
       3.85,
       M.paper
     );


     const L=
       new THREE.PointLight(
         0xffdfb2,
         3,
         12,
         2
       );

     L.position.set(
       side*10,
       5.6,
       z
     );

     scene.add(L);

   }

 }
);


/* -------------------------
   CENTRAL GARDEN
------------------------- */

box(
 0,.01,-1,
 10,.08,16,
 M.stone
);

tree(
 0,-3,
 1.05
);

tree(
 -3,1,
 .72
);

tree(
 3,1,
 .72
);

rock(-4,-3,1.1);
rock(4,5,.9);
rock(-4,6,.7);
rock(4,-7,.75);


for(
 const z of [-24,0,24]
){

 box(
   0,.65,z,
   4,.25,.65,
   M.wood
 );

 box(
   -1.5,.32,z,
   .22,.65,.22,
   M.wood
 );

 box(
   1.5,.32,z,
   .22,.65,.22,
   M.wood
 );

}


/* -------------------------
   ROOM 1
------------------------- */

const roomObjects=[];

function roomBox(
 x,y,z,
 a,b,c,
 material
){

 const o=new THREE.Mesh(
   new THREE.BoxGeometry(a,b,c),
   material
 );

 o.position.set(x,y,z);

 o.castShadow=true;
 o.receiveShadow=true;

 scene.add(o);

 roomObjects.push(o);

 return o;
}


/* Room interior dimensions:
   x = -8 to +8
   z = -38 to -27
*/

roomBox(
 0,-.1,-32.5,
 16,.25,11,
 M.roomFloor
);


/* walls */

roomBox(
 -8,4,-32.5,
 .35,8,11,
 M.roomWall
);

roomBox(
 8,4,-32.5,
 .35,8,11,
 M.roomWall
);

roomBox(
 0,4,-27.2,
 16,8,.35,
 M.roomWall
);


/* ceiling */

roomBox(
 0,8,-32.5,
 16,.25,11,
 M.roomWall
);


/* back wall */

roomBox(
 0,4,-37.8,
 16,8,.35,
 M.roomWall
);


/* doorway opening frame */

roomBox(
 -2.2,4,-27.05,
 .35,8,.6,
 M.frame
);

roomBox(
 2.2,4,-27.05,
 .35,8,.6,
 M.frame
);

roomBox(
 0,7.8,-27.05,
 4.75,.35,.6,
 M.frame
);


/* -------------------------
   ROOM 1 ARTWORK
------------------------- */

const artFrame=
roomBox(
 0,
 4.2,
 -37.45,
 7,
 4.7,
 .25,
 M.frame
);


const artwork=
roomBox(
 0,
 4.2,
 -37.28,
 6.5,
 4.2,
 .12,
 M.art
);


/* smaller inner border */

roomBox(
 0,
 4.2,
 -37.20,
 6.05,
 3.75,
 .08,
 M.paper
);


/* -------------------------
   POEM PLAQUE
------------------------- */

roomBox(
 0,
 1.8,
 -37.15,
 5.5,
 1.25,
 .12,
 M.frame
);

roomBox(
 0,
 1.8,
 -37.07,
 5.15,
 .92,
 .08,
 M.paper
);


/* -------------------------
   BENCH
------------------------- */

roomBox(
 0,
 .9,
 -29.5,
 4.8,
 .35,
 1.2,
 M.wood
);

roomBox(
 -1.9,
 .45,
 -29.5,
 .25,
 .9,
 .25,
 M.wood
);

roomBox(
 1.9,
 .45,
 -29.5,
 .25,
 .9,
 .25,
 M.wood
);


/* -------------------------
   ROOM LIGHT
------------------------- */

const roomLight=
new THREE.PointLight(
 0xffd7a5,
 4,
 14,
 2
);

roomLight.position.set(
 0,6.3,-32.5
);

scene.add(roomLight);


/* -------------------------
   CAMERA / CONTROLS
------------------------- */

let yaw=0;
let pitch=0;

let drag=false;

let lx=0;
let ly=0;

const keys={};


addEventListener(
 'keydown',
 e=>{
   keys[
     e.key.toLowerCase()
   ]=1;
 }
);


addEventListener(
 'keyup',
 e=>{
   keys[
     e.key.toLowerCase()
   ]=0;
 }
);


renderer.domElement.onpointerdown=
e=>{
 drag=true;
 lx=e.clientX;
 ly=e.clientY;
};


addEventListener(
 'pointerup',
 ()=>{
   drag=false;
 }
);


addEventListener(
 'pointermove',
 e=>{

   if(!drag)return;

   yaw-=
     (e.clientX-lx)*.004;

   pitch-=
     (e.clientY-ly)*.003;

   pitch=
     Math.max(
       -1.25,
       Math.min(1.25,pitch)
     );

   lx=e.clientX;
   ly=e.clientY;
 }
);


/* -------------------------
   ROOM STATE
------------------------- */

let insideRoom=false;


/* -------------------------
   DOOR DETECTION
------------------------- */

function nearDoor(){

 let best=null;
 let d=99;

 zs.forEach(
   (z,row)=>{

     [-1,1].forEach(
       side=>{

         const q=
           Math.hypot(
             camera.position.x-
             side*3.25,

             camera.position.z-z
           );

         if(
           q<d &&
           q<3.3
         ){

           best={
             id:
               row+
               (side>0?7:1),

             open:
               side<0 &&
               row===0
           };

           d=q;
         }

       }
     );

   }
 );

 return best;
}


/* -------------------------
   ENTER ROOM
------------------------- */

function enterRoom1(){

 insideRoom=true;

 camera.position.set(
   0,
   1.7,
   -28.8
 );

 yaw=Math.PI;

 pitch=0;

 document
 .getElementById('roomTitle')
 .style.display='block';

 document
 .getElementById('back')
 .style.display='block';

 document
 .getElementById('hud')
 .style.display='none';

 document
 .getElementById('prompt')
 .style.display='none';

 /* This is where the final song
    will begin after the visitor's
    tap/click. */

}


/* -------------------------
   RETURN TO GALLERY
------------------------- */

document
.getElementById('back')
.onclick=()=>{

 insideRoom=false;

 camera.position.set(
   0,
   1.7,
   34
 );

 yaw=0;
 pitch=0;

 document
 .getElementById('roomTitle')
 .style.display='none';

 document
 .getElementById('back')
 .style.display='none';

 document
 .getElementById('hud')
 .style.display='block';

};


/* -------------------------
   CLICK
------------------------- */

renderer.domElement.onclick=()=>{

 if(insideRoom)return;

 const n=nearDoor();

 if(!n)return;


 if(n.open){

   enterRoom1();

 }else{

   const prompt=
     document.getElementById(
       'prompt'
     );

   prompt.textContent=
     'Coming Soon — this room is not open yet.';

   prompt.style.display='block';

   setTimeout(
     ()=>{
       prompt.style.display='none';
     },
     1300
   );

 }

};


/* -------------------------
   ANIMATION
------------------------- */

function animate(){

 requestAnimationFrame(
   animate
 );


 const v=
   new THREE.Vector3();


 if(
   keys.w ||
   keys.arrowup
 ){

   v.z-=1;

 }


 if(
   keys.s ||
   keys.arrowdown
 ){

   v.z+=1;

 }


 if(
   keys.a ||
   keys.arrowleft
 ){

   v.x-=1;

 }


 if(
   keys.d ||
   keys.arrowright
 ){

   v.x+=1;

 }


 if(
   v.lengthSq()
 ){

   v.normalize();

   const s=Math.sin(yaw);
   const c=Math.cos(yaw);

   const speed=
     insideRoom ? .075 : .085;


   camera.position.x+=
     (v.x*c-v.z*s)*
     speed;


   camera.position.z+=
     (v.x*s+v.z*c)*
     speed;

 }


 /* Gallery boundaries */

 if(!insideRoom){

   camera.position.x=
     Math.max(
       -15.5,
       Math.min(
         15.5,
         camera.position.x
       )
     );

   camera.position.z=
     Math.max(
       -36,
       Math.min(
         36,
         camera.position.z
       )
     );

 }


 /* Room boundaries */

 if(insideRoom){

   camera.position.x=
     Math.max(
       -7,
       Math.min(
         7,
         camera.position.x
       )
     );

   camera.position.z=
     Math.max(
       -37,
       Math.min(
         -27.8,
         camera.position.z
       )
     );

 }


 camera.rotation.order='YXZ';

 camera.rotation.y=yaw;

 camera.rotation.x=pitch;


 if(!insideRoom){

   const n=nearDoor();

   const prompt=
     document.getElementById(
       'prompt'
     );

   if(n){

     prompt.textContent=
       n.open
       ? 'Enter Room 1'
       : 'Room '+n.id+
         ' · Coming Soon';

     prompt.style.display='block';

   }else{

     prompt.style.display='none';

   }

 }


 renderer.render(
   scene,
   camera
 );

}


addEventListener(
 'resize',
 ()=>{

   camera.aspect=
     innerWidth/
     innerHeight;

   camera.updateProjectionMatrix();

   renderer.setSize(
     innerWidth,
     innerHeight
   );

 }
);


animate();

</script>
</body>
</html>
