<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tullee & Spring — Room 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9c8b2}
canvas{display:block}
#info{
position:fixed;top:15px;left:15px;z-index:5;
padding:12px 16px;background:rgba(255,255,255,.85);
border-radius:10px;font:16px Georgia,serif;color:#263326
}
</style>
</head>
<body>

<div id="info">
<b>TULLEE & SPRING</b><br>
Room 1 — The First Meeting<br>
WASD / Arrow keys to walk · Drag to look
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb9c8b2);

const camera=new THREE.PerspectiveCamera(
70,innerWidth/innerHeight,.1,1000
);
camera.position.set(0,1.7,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe8eee5,0x4d443b,1.6));
scene.add(new THREE.DirectionalLight(0xfff4dc,2.2));

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshStandardMaterial({
  color:0x62594d,
  roughness:.9
})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);
function wall(x,y,z,w,h,d){
const new THREE.MeshStandardMaterial({
  color:0xd0c3ae,
  roughness:.8
})
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:0xd8cbb7})
);
m.position.set(x,y,z);
scene.add(m);
}

/* Four walls with an opening in the front wall */
// Room 1 gallery walls
wall(-7,2,0,.5,4,14);
wall(7,2,0,.5,4,14);
wall(0,4,-7,14,8,.5);

// Back wall
wall(-4.5,2,7,5,4,.5);
wall(4.5,2,7,5,4,.5);

// Large entrance doorway
wall(-3,2,-7,8,4,.5);
wall(3,2,-7,8,4,.5);

// Doorway header
wall(0,3.5,-7,2,1,.5);

function tree(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.35,3),
new THREE.MeshStandardMaterial({color:0x5b4633})
);
trunk.position.set(x,1.5,z);
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.4,16,12),
new THREE.MeshStandardMaterial({color:0x527052})
);
leaves.position.set(x,3.5,z);
scene.add(leaves);
}

tree(-4,-1);
tree(4,-1);

function rock(x,z,s){
const r=new THREE.Mesh(
new THREE.DodecahedronGeometry(s),
new THREE.MeshStandardMaterial({color:0x777268,roughness:1})
);
r.position.set(x,s*.7,z);
r.rotation.y=Math.random();
scene.add(r);
}

rock(-2,1,.8);
rock(2,1,.6);
rock(-5,2,.5);

let keys={};
let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener("pointerup",()=>{
  dragging=false;
});

renderer.domElement.addEventListener("pointermove",e=>{
  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  camera.rotation.y-=dx*0.004;
  camera.rotation.x-=dy*0.003;

  camera.rotation.x=Math.max(
    -Math.PI/2.2,
    Math.min(Math.PI/2.2,camera.rotation.x)
  );

  lastX=e.clientX;
  lastY=e.clientY;
});
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function move(){
const speed=.09;
if(keys.w||keys.arrowup)camera.position.z-=speed;
if(keys.s||keys.arrowdown)camera.position.z+=speed;
if(keys.a||keys.arrowleft)camera.position.x-=speed;
if(keys.d||keys.arrowright)camera.position.x+=speed;

camera.position.x=Math.max(-6.3,Math.min(6.3,camera.position.x));
camera.position.z=Math.max(-2.3,Math.min(7.5,camera.position.z));
}

function animate(){
requestAnimationFrame(animate);
move();
renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
