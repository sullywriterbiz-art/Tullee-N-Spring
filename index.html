<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tullee and Spring</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080706;
}

#title{
  position:fixed;
  top:22px;
  left:28px;
  z-index:10;
  color:#eee6d8;
  font-family:Georgia,serif;
  font-size:24px;
  letter-spacing:2px;
}

#instructions{
  position:fixed;
  bottom:22px;
  left:28px;
  z-index:10;
  color:#aaa397;
  font-family:Arial,sans-serif;
  font-size:14px;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<div id="title">TULLEE AND SPRING</div>
<div id="instructions">WASD or arrow keys to walk</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080706);
scene.fog = new THREE.FogExp2(0x080706, 0.035);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0,1.7,18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);


/* FLOOR */

const floorTexture = new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/hardwood2_diffuse.jpg"
);

floorTexture.wrapS = THREE.RepeatWrapping;
floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(8,24);

const floorMaterial = new THREE.MeshStandardMaterial({
  map:floorTexture,
  roughness:0.65
});

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(28,80),
  floorMaterial
);

floor.rotation.x = -Math.PI/2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);


/* WALLS */

const wallMaterial = new THREE.MeshStandardMaterial({
  color:0x171411,
  roughness:0.9
});

const leftWall = new THREE.Mesh(
  new THREE.BoxGeometry(1,7,80),
  wallMaterial
);

leftWall.position.set(-14,3.5,0);
scene.add(leftWall);

const rightWall = leftWall.clone();
rightWall.position.x = 14;
scene.add(rightWall);


/* CEILING */

const ceiling = new THREE.Mesh(
  new THREE.BoxGeometry(28,1,80),
  new THREE.MeshStandardMaterial({
    color:0x0d0b0a
  })
);

ceiling.position.set(0,7,0);
scene.add(ceiling);


/* PATH LIGHTS */

const pathMaterial = new THREE.MeshStandardMaterial({
  color:0x8a7354,
  emissive:0x332515,
  emissiveIntensity:0.8
});

for(let z=15; z>-36; z-=4){

  const light = new THREE.Mesh(
    new THREE.BoxGeometry(1.2,0.04,0.35),
    pathMaterial
  );

  light.position.set(0,0.025,z);
  scene.add(light);

}


/* PHOTO LIGHTS */

for(let z=10; z>-35; z-=10){

  const lamp = new THREE.PointLight(
    0xffe8bd,
    4,
    9
  );

  lamp.position.set(0,4.8,z);
  lamp.castShadow = true;
  scene.add(lamp);

}


/* VERY SOFT AMBIENT LIGHT */

const ambient = new THREE.HemisphereLight(
  0x403b34,
  0x080706,
  0.35
);

scene.add(ambient);


/* MOVEMENT */

const keys = {};

window.addEventListener("keydown",function(event){
  keys[event.key.toLowerCase()] = true;
});

window.addEventListener("keyup",function(event){
  keys[event.key.toLowerCase()] = false;
});


function move(){

  const speed = 0.10;

  if(keys["w"] || keys["arrowup"]){
    camera.position.z -= speed;
  }

  if(keys["s"] || keys["arrowdown"]){
    camera.position.z += speed;
  }

  if(keys["a"] || keys["arrowleft"]){
    camera.position.x -= speed;
  }

  if(keys["d"] || keys["arrowright"]){
    camera.position.x += speed;
  }

  camera.position.x = Math.max(-12,Math.min(12,camera.position.x));
  camera.position.z = Math.max(-38,Math.min(18,camera.position.z));

}


/* RESIZE */

window.addEventListener("resize",function(){

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});


/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  move();

  renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
