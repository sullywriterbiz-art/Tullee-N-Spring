

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tullee &amp; Spring — HorseHills</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171512;font-family:Georgia,serif}
canvas{display:block;touch-action:none}
#heading{position:fixed;z-index:4;top:14px;left:16px;color:#f1e8d8;font:12px/1.4 Arial,sans-serif;letter-spacing:.14em;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:fixed;z-index:4;left:50%;bottom:15px;transform:translateX(-50%);max-width:90vw;padding:8px 12px;border-radius:18px;background:rgba(25,22,18,.72);color:#eee3d0;font:12px Arial,sans-serif;text-align:center;pointer-events:none}
#enter,#poemModal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(12,11,9,.78)}
#enterCard{max-width:440px;padding:28px 26px;text-align:center;color:#f3eadb;background:rgba(34,29,23,.96);border:1px solid #a78c62;border-radius:8px}
#enterCard h1{margin:0 0 12px;font-weight:normal;font-size:clamp(25px,5vw,36px)}
#enterCard p{line-height:1.55;color:#ddd1bd}
button{font:14px Arial,sans-serif;color:#f7eddd;background:#55452f;border:1px solid #b69b70;border-radius:22px;padding:11px 17px;cursor:pointer;touch-action:manipulation}
#enterButton{margin-top:8px;padding:12px 24px}
#poemModal{display:none;background:rgba(8,7,6,.94);z-index:20;flex-direction:column;gap:12px}
#poemImage{display:block;max-width:94vw;max-height:82vh;object-fit:contain;background:#eee8da;box-shadow:0 8px 35px #000}
#closePoem{align-self:flex-end;margin-right:2vw}
#touchControls{position:fixed;z-index:5;left:14px;bottom:58px;display:none;gap:8px;align-items:center}
#touchControls button{width:48px;height:48px;padding:0;border-radius:50%;font-size:20px;background:rgba(42,35,27,.82);user-select:none;-webkit-user-select:none}
#touchControls .stack{display:flex;flex-direction:column;gap:7px}
@media(pointer:coarse){
  #touchControls{display:flex}
  #hint{bottom:13px;left:auto;right:12px;transform:none;max-width:48vw}
}
</style>
</head>
<body>

<div id="heading">TULLEE &amp; SPRING · INSTALLATION 1</div>
<div id="hint">Drag to look · Use the arrows to move · Tap the poem to enlarge</div>

<div id="touchControls" aria-label="Room movement controls">
  <div class="stack">
    <button data-move="forward" aria-label="Forward">↑</button>
    <button data-move="back" aria-label="Back">↓</button>
  </div>
  <div class="stack">
    <button data-move="left" aria-label="Turn left">←</button>
    <button data-move="right" aria-label="Turn right">→</button>
  </div>
</div>

<div id="enter">
  <div id="enterCard">
    <h1>Tullee &amp; Spring</h1>
    <p>HorseHills</p>
    <p>Enter the room, take a look around, and spend a little time with the photograph and poem.</p>
    <button id="enterButton">Enter the room</button>
  </div>
</div>

<div id="poemModal">
  <button id="closePoem">Close poem</button>
  <img id="poemImage" src="assets/poems/HorseHills.png" alt="HorseHills poem">
</div>

<audio id="roomSong" src="assets/music/horse%20hills.mp3" preload="auto" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xaaa397);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,6.4);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.84;
document.body.appendChild(renderer.domElement);

// The room
const room=new THREE.Group();
scene.add(room);

const wallMat=new THREE.MeshStandardMaterial({color:0xd0c8b9,roughness:1});
const sideMat=new THREE.MeshStandardMaterial({color:0xc3b9a9,roughness:1});
const ceilingMat=new THREE.MeshStandardMaterial({color:0xe0d9cc,roughness:1});

function panel(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  room.add(m);
  return m;
}

// Create a subtle hardwood texture with soft grain and a gentle sheen.
function makeWoodTexture(){
  const canvas=document.createElement('canvas');
  canvas.width=1024;
  canvas.height=1024;
  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#806344';
  ctx.fillRect(0,0,1024,1024);

  // Gentle variation between wide boards.
  const boardHeight=128;
  for(let y=0;y<1024;y+=boardHeight){
    const shade= y%256===0 ? '#896d4e' : '#806243';
    ctx.fillStyle=shade;
    ctx.fillRect(0,y,1024,boardHeight);

    // Very fine, low-contrast wood grain.
    for(let i=0;i<34;i++){
      const gy=y+Math.random()*boardHeight;
      const start=Math.random()*250;
      const length=250+Math.random()*700;
      ctx.beginPath();
      ctx.moveTo(start,gy);
      ctx.bezierCurveTo(
        start+length*.3,gy-2+Math.random()*4,
        start+length*.7,gy-2+Math.random()*4,
        Math.min(1024,start+length),gy
      );
      ctx.strokeStyle=Math.random()>.5
        ? 'rgba(42,27,15,0.055)'
        : 'rgba(238,207,163,0.055)';
      ctx.lineWidth=.5+Math.random()*1.2;
      ctx.stroke();
    }

    // Nearly invisible board edges.
    ctx.fillStyle='rgba(38,25,15,0.12)';
    ctx.fillRect(0,y+boardHeight-1,1024,1);
  }

  // Subtle staggered end joints.
  for(let y=0;y<1024;y+=boardHeight){
    const x=((Math.floor(y/boardHeight)%2)===0)?340:700;
    ctx.fillStyle='rgba(38,25,15,0.13)';
    ctx.fillRect(x,y,1,boardHeight);
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const woodTexture=makeWoodTexture();
const floorMat=new THREE.MeshStandardMaterial({
  map:woodTexture,
  color:0xffffff,
  roughness:.34,
  metalness:.025
});

panel(18,.22,16,floorMat,0,-.12,0);
panel(18,.22,16,ceilingMat,0,6.2,0);
panel(18,6.2,.22,wallMat,0,3.0,-8);
panel(18,6.2,.22,sideMat,0,3.0,8);
panel(.22,6.2,16,sideMat,-9,3,0);
panel(.22,6.2,16,sideMat,9,3,0);

// Soft, warm lighting at a lower overall level.
scene.add(new THREE.HemisphereLight(0xfff4df,0x51483d,.78));

const mainLight=new THREE.DirectionalLight(0xffedcf,.82);
mainLight.position.set(-3,7,5);
scene.add(mainLight);

const fillLight=new THREE.PointLight(0xffe5c2,15,20,2);
fillLight.position.set(0,4.8,-3.8);
scene.add(fillLight);

// Frames for the photograph and poem.
const frameMat=new THREE.MeshStandardMaterial({
  color:0x493723,
  roughness:.5,
  metalness:.12
});

const innerMat=new THREE.MeshStandardMaterial({
  color:0xe7ddc8,
  roughness:.9
});

function framedImage(src,x,y,w,h,isPoem=false){
  const group=new THREE.Group();
  group.position.set(x,y,-7.82);
  room.add(group);

  const backing=new THREE.Mesh(
    new THREE.BoxGeometry(w+.34,h+.34,.18),
    frameMat
  );
  group.add(backing);

  const trim=new THREE.Mesh(
    new THREE.BoxGeometry(w+.08,h+.08,.035),
    innerMat
  );
  trim.position.z=.075;
  group.add(trim);

  const mat=new THREE.MeshBasicMaterial({color:0xffffff});
  const image=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  image.position.z=.098;
  image.renderOrder=2;
  group.add(image);

  const loader=new THREE.TextureLoader();
  loader.load(
    src,
    t=>{
      t.colorSpace=THREE.SRGBColorSpace;
      mat.map=t;
      mat.needsUpdate=true;
    },
    undefined,
    ()=>{
      mat.color.set(isPoem?0xe9e2d4:0x777064);
      console.warn('Could not load artwork:',src);
    }
  );

  return {group,image};
}

// Photograph and poem.
const photo=framedImage('HorseHills.jpg',-3.0,3.15,4.7,3.0,false);
const poem=framedImage('assets/poems/HorseHills.png',3.05,3.15,3.25,4.15,true);

// Gentle, bounded movement.
const held={
  forward:false,
  back:false,
  left:false,
  right:false
};

const keys={};
let yaw=0;
let pitch=0;
let dragging=false;
let lastX=0;
let lastY=0;
let entered=false;

const clock=new THREE.Clock();

function update(dt){
  const turn=.72*dt;

  if(keys.ArrowLeft||held.left)yaw+=turn;
  if(keys.ArrowRight||held.right)yaw-=turn;

  const speed=1.05*dt;
  let forward=0;

  if(keys.KeyW||keys.ArrowUp||held.forward)forward+=speed;
  if(keys.KeyS||keys.ArrowDown||held.back)forward-=speed;

  if(forward){
    camera.position.x-=Math.sin(yaw)*forward;
    camera.position.z-=Math.cos(yaw)*forward;
  }

  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7.4,7.4);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-6.7,6.7);

  camera.rotation.set(pitch,yaw,0,'YXZ');
}

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code.startsWith('Arrow'))e.preventDefault();
});

addEventListener('keyup',e=>keys[e.code]=false);

// Mouse look.
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||e.pointerType==='pen'){
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  yaw-=dx*.0015;
  pitch=THREE.MathUtils.clamp(pitch+dy*.0012,-.38,.38);

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

// Touch look.
let touchLook=null;

renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    touchLook={
      x:e.touches[0].clientX,
      y:e.touches[0].clientY
    };
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove',e=>{
  if(!touchLook||e.touches.length!==1)return;

  const t=e.touches[0];
  const dx=t.clientX-touchLook.x;
  const dy=t.clientY-touchLook.y;

  yaw-=dx*.0018;
  pitch=THREE.MathUtils.clamp(pitch+dy*.0012,-.38,.38);

  touchLook={x:t.clientX,y:t.clientY};
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>touchLook=null);

// On-screen movement buttons.
document.querySelectorAll('[data-move]').forEach(b=>{
  const d=b.dataset.move;

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    held[d]=true;
  });

  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    b.addEventListener(ev,()=>held[d]=false);
  });
});

// Tap or click the poem to enlarge it.
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('click',e=>{
  if(dragging||!entered)return;

  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(pointer,camera);

  if(raycaster.intersectObject(poem.image).length){
    document.getElementById('poemModal').style.display='flex';
  }
});

document.getElementById('closePoem').addEventListener('click',()=>{
  document.getElementById('poemModal').style.display='none';
});

document.getElementById('poemModal').addEventListener('click',e=>{
  if(e.target.id==='poemModal'){
    e.currentTarget.style.display='none';
  }
});

// Start the song when the visitor enters.
const song=document.getElementById('roomSong');
song.loop=true;

document.getElementById('enterButton').addEventListener('click',()=>{
  entered=true;
  document.getElementById('enter').style.display='none';

  song.play().catch(()=>{
    document.getElementById('hint').textContent=
      'Your browser blocked playback. Please check your sound settings.';
  });
});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(entered)update(dt);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
