

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tullee & Spring</title>

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080706;
  color:#eee6d8;
  font-family:Georgia,serif;
}

canvas { display:block; }

#title {
  position:fixed;
  top:20px;
  left:24px;
  z-index:5;
  font-size:22px;
  letter-spacing:3px;
  text-shadow:0 2px 8px #000;
  pointer-events:none;
}

#instructions {
  position:fixed;
  bottom:18px;
  left:24px;
  z-index:5;
  color:#c4b9a8;
  font:12px Arial,sans-serif;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}

#status {
  position:fixed;
  top:20px;
  right:22px;
  z-index:5;
  color:#d7c6a9;
  font:12px Arial,sans-serif;
  text-align:right;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}

#enter {
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(5,5,4,.9);
  text-align:center;
  padding:24px;
}

#enterBox { max-width:520px; }

#enter h1 {
  font-size:clamp(28px,5vw,46px);
  font-weight:normal;
  letter-spacing:4px;
  margin:0 0 18px;
}

#enter p {
  color:#c7bdad;
  line-height:1.7;
}

#enter button,#audioButton {
  border:1px solid #a48a62;
  background:#30271d;
  color:#f2e6d2;
  padding:13px 25px;
  font:15px Georgia,serif;
  cursor:pointer;
}

#enter button { margin-top:18px; }

#audioButton {
  position:fixed;
  z-index:6;
  right:20px;
  bottom:18px;
  padding:8px 12px;
  font:12px Arial,sans-serif;
  opacity:.85;
}

#touchControls {
  position:fixed;
  z-index:8;
  bottom:62px;
  left:18px;
  display:none;
  gap:7px;
  align-items:center;
  user-select:none;
  -webkit-user-select:none;
}

#touchControls button {
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid #a48a62;
  background:rgba(35,29,22,.78);
  color:#f2e6d2;
  font-size:19px;
  touch-action:none;
}

#touchControls .middle {
  display:flex;
  flex-direction:column;
  gap:7px;
}

#touchHint {
  position:fixed;
  z-index:5;
  bottom:18px;
  right:20px;
  font:11px Arial,sans-serif;
  color:#c4b9a8;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}

@media (pointer:coarse) {
  #touchControls { display:flex; }
  #instructions { display:none; }
  #touchHint { bottom:18px; right:18px; }
}
</style>
</head>

<body>

<div id="title">TULLEE & SPRING</div>
<div id="status">THE GALLERY</div>

<div id="instructions">
W / S — walk &nbsp; A / D — move sideways &nbsp; Arrow keys — look
</div>

<div id="touchHint">Drag to look around</div>
<button id="audioButton">Pause music</button>

<div id="touchControls">
  <div class="middle">
    <button data-move="forward">↑</button>
    <button data-move="back">↓</button>
  </div>
  <div class="middle">
    <button data-move="left">←</button>
    <button data-move="right">→</button>
  </div>
</div>

<div id="enter">
  <div id="enterBox">
    <h1>TULLEE & SPRING</h1>
    <p>A story told through twelve photographs, twelve poems, and twelve songs.</p>
    <p>Enter the woodland. Follow the trail. Take your time.</p>
    <button id="enterButton">Enter the gallery</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
"use strict";

if (!window.THREE) {
  document.getElementById("enterBox").innerHTML =
    "<h1>TULLEE & SPRING</h1><p>The 3D library could not load. Please check your internet connection and reload.</p>";
  return;
}

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080a08);
scene.fog = new THREE.FogExp2(0x080a08,0.0015);

const camera = new THREE.PerspectiveCamera(
  70,innerWidth/innerHeight,0.1,1500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

const loader = new THREE.TextureLoader();
const clock = new THREE.Clock();

// --------------------------------------------------
// PHOTOGRAPHS, POEMS AND MUSIC
// --------------------------------------------------

const photos = [
  "HorseHills.jpg",
  "Daughters Four.jpg",
  "Ode to Tullee.jpg",
  "Fall Loves Death.jpg",
  "Order.jpg",
  "Regrets.jpg",
  "Apology.jpg",
  "Hawk.jpg",
  "Lady Bug.jpg",
  "Two Bucks.jpg",
  "Messy Ending.jpg",
  "Above.jpg"
];

const poems = [
  "HorseHills.png",
  "Daughters Four.png",
  "Ode to Tullee.png",
  "Fall Loves Death.png",
  "Order Called.png",
  "Regrets.png",
  "Apology.png",
  "Hawk.png",
  "Lady Bugs.png",
  "Two Bucks.png",
  "Messy Endings.png",
  "Above.png"
];

const songs = [
  "horse hills.mp3",
  "Daughters Four.mp3",
  "Ode to Tullee.mp3",
  "fall loves death.mp3",
  "Order.mp3",
  "Regrets.mp3",
  "Apology.mp3",
  "Hawk.mp3",
  "Lady Bugs.mp3",
  "Two Bucks.mp3",
  "Messy Ending.mp3",
  "Above.mp3"
];

const installations = photos.map((photo,i) => ({
  photo,
  poem:poems[i],
  song:songs[i],
  number:i+1,
  t:0.105+i*0.071,
  side:i%2===0 ? 1 : -1
}));

// --------------------------------------------------
// OPEN WOODLAND ENVIRONMENT
// --------------------------------------------------

// The walking environment is greatly expanded.
// Displays remain human-sized.

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,800),
  new THREE.MeshStandardMaterial({
    color:0x29251d,
    roughness:1
  })
);

ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.12,-20);
ground.receiveShadow=true;
scene.add(ground);

// Natural woodland lighting

scene.add(
  new THREE.HemisphereLight(0x82917a,0x211b12,.75)
);

const ambient = new THREE.PointLight(0x9b7950,1.5,100);
ambient.position.set(0,9,290);
scene.add(ambient);

// --------------------------------------------------
// WINDING WOODLAND TRAIL
// --------------------------------------------------

const routePoints = [
  new THREE.Vector3(0,0,310),
  new THREE.Vector3(-10,0,250),
  new THREE.Vector3(-40,0,190),
  new THREE.Vector3(-50,0,130),
  new THREE.Vector3(-20,0,70),
  new THREE.Vector3(30,0,10),
  new THREE.Vector3(50,0,-50),
  new THREE.Vector3(20,0,-110),
  new THREE.Vector3(-30,0,-170),
  new THREE.Vector3(-40,0,-230),
  new THREE.Vector3(0,0,-290),
  new THREE.Vector3(30,0,-340)
];

const route = new THREE.CatmullRomCurve3(routePoints);
const routeLength = route.getLength();

function pointAt(t) {
  return route.getPointAt(
    THREE.MathUtils.clamp(t,0,1)
  );
}

function tangentAt(t) {
  return route.getTangentAt(
    THREE.MathUtils.clamp(t,0,1)
  ).normalize();
}

function sideAt(t) {
  const tangent=tangentAt(t);
  return new THREE.Vector3(
    -tangent.z,0,tangent.x
  ).normalize();
}

// Earthy trail

const trail = new THREE.Mesh(
  new THREE.TubeGeometry(route,500,2.5,10,false),
  new THREE.MeshStandardMaterial({
    color:0x594630,
    roughness:1
  })
);

trail.position.y=.04;
scene.add(trail);

// --------------------------------------------------
// ROCKS ALONG THE TRAIL
// --------------------------------------------------

const rockMaterial = new THREE.MeshStandardMaterial({
  color:0x62594b,
  roughness:1
});

const rockGeometry = new THREE.DodecahedronGeometry(.65,0);

for(let i=0;i<240;i++) {
  const t=.008+i/240*.98;
  const p=pointAt(t);
  const side=sideAt(t);

  for(const s of [-1,1]) {
    const rock=new THREE.Mesh(rockGeometry,rockMaterial);

    const offset=7+Math.random()*3.5;

    rock.position.set(
      p.x+side.x*s*offset,
      .35+Math.random()*.2,
      p.z+side.z*s*offset
    );

    const scale=.65+Math.random()*1.3;

    rock.scale.set(
      scale,
      .55+Math.random()*.8,
      scale
    );

    rock.rotation.set(
      Math.random(),
      Math.random()*3,
      Math.random()
    );

    rock.castShadow=true;
    rock.receiveShadow=true;
    scene.add(rock);
  }
}

// --------------------------------------------------
// TREES AND WOODLAND DETAILS
// --------------------------------------------------

const trunkMaterial = new THREE.MeshStandardMaterial({
  color:0x403022,
  roughness:1
});

const leafMaterials = [
  new THREE.MeshStandardMaterial({color:0x263326,roughness:1}),
  new THREE.MeshStandardMaterial({color:0x34422d,roughness:1}),
  new THREE.MeshStandardMaterial({color:0x1c2b20,roughness:1})
];

function addTree(x,z,size=3) {

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .22*size,.42*size,4.5*size,8
    ),
    trunkMaterial
  );

  trunk.position.set(x,2.25*size,z);
  trunk.castShadow=true;
  scene.add(trunk);

  for(let i=0;i<4;i++) {
    const crown=new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        1.35*size-i*.12*size,1
      ),
      leafMaterials[i%leafMaterials.length]
    );

    crown.position.set(
      x+(Math.random()-.5)*.6*size,
      3.4*size+i*.8*size,
      z+(Math.random()-.5)*.6*size
    );

    crown.scale.set(
      1,
      1.15,
      1
    );

    crown.castShadow=true;
    scene.add(crown);
  }
}

// Trees distributed along the woodland route.
// Leave the central walking trail open.

for(let i=0;i<30;i++) {
  const t=.015+i/30*.97;
  const p=pointAt(t);
  const side=sideAt(t);

  for(const s of [-1,1]) {
    const offset=38+Math.random()*28;

    addTree(
      p.x+side.x*s*offset,
      p.z+side.z*s*offset,
      2.2+Math.random()*1.8
    );
  }
}

// Additional woodland trees for depth

[
  [-105,260],[95,220],[-115,110],[105,45],
  [-100,-65],[110,-150],[-95,-245],[105,-300],
  [-65,330],[75,-350]
].forEach(([x,z],i)=>{
  addTree(x,z,2.5+(i%3)*.65);
});

// --------------------------------------------------
// ENTRANCE COVER PHOTOGRAPH
// --------------------------------------------------

function addCover() {

  const group=new THREE.Group();

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(9,6,.35),
    new THREE.MeshStandardMaterial({
      color:0x392b1e,
      roughness:.8
    })
  );

  group.add(frame);

  const tex=loader.load("TheTrail.jpg",t=>{
    t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  });

  const image=new THREE.Mesh(
    new THREE.PlaneGeometry(8.6,5.6),
    new THREE.MeshBasicMaterial({
      map:tex,
      side:THREE.DoubleSide
    })
  );

  image.position.z=.2;
  group.add(image);

  group.position.set(0,5,255);
  scene.add(group);

  const light=new THREE.PointLight(0xffdca8,3,35);
  light.position.set(0,8,240);
  scene.add(light);
}

addCover();

// --------------------------------------------------
// PHOTOGRAPH AND POEM DISPLAY CONSTRUCTION
// --------------------------------------------------

const displayLights=[];
const photoPositions=[];

function makeImagePanel(
  file,width,height,position,yaw,frameColor
) {

  const group=new THREE.Group();

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.35,height+.35,.22
    ),
    new THREE.MeshStandardMaterial({
      color:frameColor,
      roughness:.75
    })
  );

  group.add(frame);

  const texture=loader.load(
    file,
    t=>{
      t.colorSpace=THREE.SRGBColorSpace;
      t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    },
    undefined,
    ()=>{
      console.warn("Could not load image:",file);
    }
  );

  const image=new THREE.Mesh(
    new THREE.PlaneGeometry(width,height),
    new THREE.MeshBasicMaterial({
      map:texture,
      side:THREE.DoubleSide
    })
  );

  image.position.z=.13;
  group.add(image);

  group.position.copy(position);
  group.rotation.y=yaw;

  scene.add(group);

  return group;
}

// --------------------------------------------------
// THE TWELVE INSTALLATIONS
// --------------------------------------------------

installations.forEach((item,i)=>{

  const p=pointAt(item.t);
  const side=sideAt(item.t);
  const tangent=tangentAt(item.t);

  const direction=side.clone().multiplyScalar(item.side);

  // Each display has much more space around it.

  const displayCenter=p.clone().addScaledVector(
    direction,15
  );

  displayCenter.y=4.3;

  const towardPath=direction.clone().negate();

  const yaw=Math.atan2(
    towardPath.x,towardPath.z
  );

  // Main photograph

  const photoPosition=displayCenter.clone();

  photoPosition.addScaledVector(tangent,-3);

  makeImagePanel(
    item.photo,
    8.5,
    6.5,
    photoPosition,
    yaw,
    0x3b2c20
  );

  photoPositions.push(photoPosition.clone());

  // Poem display

  const poemPosition=displayCenter.clone();

  poemPosition.addScaledVector(tangent,7);

  makeImagePanel(
    "assets/poems/"+item.poem,
    3.3,
    4.8,
    poemPosition,
    yaw,
    0x4a3928
  );

  // Photograph spotlight

  const light=new THREE.SpotLight(
    0xffdca7,
    0,
    45,
    Math.PI/3,
    .5,
    1
  );

  light.position.copy(photoPosition);
  light.position.y=12;

  const target=new THREE.Object3D();

  target.position.copy(photoPosition);
  target.y=4;

  scene.add(target);

  light.target=target;
  light.castShadow=true;

  scene.add(light);
  displayLights.push(light);

  // Wooden trail sign

  const signPosition=p.clone().addScaledVector(
    direction,8.5
  );

  const post=new THREE.Mesh(
    new THREE.BoxGeometry(.3,2.3,.3),
    trunkMaterial
  );

  post.position.set(
    signPosition.x,1.15,signPosition.z
  );

  scene.add(post);

  const board=new THREE.Mesh(
    new THREE.BoxGeometry(2.6,.85,.2),
    new THREE.MeshStandardMaterial({
      color:0x503a25,
      roughness:.9
    })
  );

  board.position.set(
    signPosition.x,2.15,signPosition.z
  );

  board.rotation.y=yaw;
  scene.add(board);

  const signText=document.createElement("canvas");

  signText.width=512;
  signText.height=128;

  const ctx=signText.getContext("2d");

  ctx.fillStyle="#503a25";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle="#ead8b9";
  ctx.font="bold 54px Georgia";
  ctx.textAlign="center";

  ctx.fillText(
    i===11?"THE END":"→ "+(i+2),
    256,82
  );

  const signTexture=new THREE.CanvasTexture(signText);

  const signFace=new THREE.Mesh(
    new THREE.PlaneGeometry(2.45,.7),
    new THREE.MeshBasicMaterial({
      map:signTexture,
      side:THREE.DoubleSide
    })
  );

  signFace.position.set(
    signPosition.x,2.15,signPosition.z
  );

  signFace.rotation.y=yaw;
  scene.add(signFace);
});

// --------------------------------------------------
// OPENING TRAIL SIGN
// --------------------------------------------------

function addOpeningSign() {

  const p=pointAt(.035);
  const side=sideAt(.035);

  const x=p.x+side.x*9;
  const z=p.z+side.z*9;

  const post=new THREE.Mesh(
    new THREE.BoxGeometry(.3,3,.3),
    trunkMaterial
  );

  post.position.set(x,1.5,z);
  scene.add(post);

  const board=new THREE.Mesh(
    new THREE.BoxGeometry(5.5,1.2,.25),
    new THREE.MeshStandardMaterial({
      color:0x503a25
    })
  );

  board.position.set(x,3,z);
  scene.add(board);

  const c=document.createElement("canvas");

  c.width=512;
  c.height=128;

  const ctx=c.getContext("2d");

  ctx.fillStyle="#503a25";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle="#ead8b9";
  ctx.font="40px Georgia";
  ctx.textAlign="center";

  ctx.fillText("TULLEE & SPRING",256,82);

  const tex=new THREE.CanvasTexture(c);

  const face=new THREE.Mesh(
    new THREE.PlaneGeometry(5.3,1.1),
    new THREE.MeshBasicMaterial({
      map:tex,
      side:THREE.DoubleSide
    })
  );

  face.position.set(x,3,z+.14);
  scene.add(face);
}

addOpeningSign();

// --------------------------------------------------
// LOW TRAIL LIGHTING
// --------------------------------------------------

const trailLights=[];

for(let i=0;i<14;i++) {

  const t=.025+i*.068;
  const p=pointAt(t);
  const side=sideAt(t);

  const position=p.clone().addScaledVector(side,5);

  const lamp=new THREE.Mesh(
    new THREE.SphereGeometry(.4,8,8),
    new THREE.MeshBasicMaterial({
      color:0xffc47b
    })
  );

  lamp.position.set(position.x,.55,position.z);
  scene.add(lamp);

  const light=new THREE.PointLight(
    0xffbd73,.7,18
  );

  light.position.copy(lamp.position);
  light.position.y=1;
  scene.add(light);

  trailLights.push(light);
}

// --------------------------------------------------
// FINAL AREA
// --------------------------------------------------

const endingLight=new THREE.PointLight(
  0xffd39a,2.5,60
);

endingLight.position.set(20,12,-335);
scene.add(endingLight);

// --------------------------------------------------
// PLAYER AND MOVEMENT
// --------------------------------------------------

let progress=.015;
let unlocked=0;
let activeInstallation=-1;

let lookYaw=0;
let lookPitch=0;
let lateralOffset=0;

let entered=false;

const keys={};

const held={
  forward:false,
  back:false,
  left:false,
  right:false
};

function updateCamera() {

  const p=pointAt(progress);
  const tangent=tangentAt(progress);
  const side=sideAt(progress);

  const baseYaw=Math.atan2(
    -tangent.x,-tangent.z
  );

  const yaw=baseYaw+lookYaw;

  camera.position.set(
    p.x+side.x*lateralOffset,
    1.8,
    p.z+side.z*lateralOffset
  );

  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=lookPitch;
}

function updatePlayer(delta) {

  if(!entered) return;

  let forward=0;
  let sideways=0;

  if(keys.KeyW || keys.ArrowUp || held.forward) forward++;
  if(keys.KeyS || keys.ArrowDown || held.back) forward--;

  if(keys.KeyD || held.right) sideways++;
  if(keys.KeyA || held.left) sideways--;

  // Comfortable walking speed in the larger environment

  const speed=2.3;

  const nextStop=installations[unlocked];

  const maxProgress=nextStop
    ? Math.min(1,nextStop.t+.012)
    : 1;

  progress += forward*speed*delta/routeLength;

  progress=THREE.MathUtils.clamp(
    progress,0,maxProgress
  );

  lateralOffset += sideways*5*delta;

  lateralOffset=THREE.MathUtils.clamp(
    lateralOffset,-5,5
  );
}

// --------------------------------------------------
// INSTALLATION CHECKPOINTS
// --------------------------------------------------

function updateInstallations() {

  if(unlocked>=installations.length) return;

  const item=installations[unlocked];

  if(Math.abs(progress-item.t)<.012) {

    activeInstallation=unlocked;
    unlocked++;

    updateStatus();
  }
}

function updateStatus() {

  const status=document.getElementById("status");

  if(activeInstallation>=0) {
    status.textContent=
      "INSTALLATION "+(activeInstallation+1)+" OF 12";
  } else {
    status.textContent="FOLLOW THE TRAIL";
  }

  if(unlocked>=12) {
    status.textContent="THE JOURNEY'S END";
  }
}

// --------------------------------------------------
// PROXIMITY-BASED MUSIC
// --------------------------------------------------

// Music fades in as the visitor approaches a photograph.
// It reaches full volume close to the photograph.
// It fades away as the visitor walks away.

let currentAudio=null;
let currentAudioIndex=-1;
let musicPaused=false;

const fadingAudios=[];

// Start the selected song

function startMusic(index) {

  if(index===currentAudioIndex) return;

  if(currentAudio) {
    fadingAudios.push(currentAudio);
  }

  const audio=new Audio(
    "assets/music/"+installations[index].song
  );

  audio.loop=true;
  audio.volume=0;

  currentAudio=audio;
  currentAudioIndex=index;

  if(!musicPaused) {
    audio.play().catch(err=>{
      console.warn("Audio could not start:",err);
    });
  }
}

// Find the closest photograph

function updateProximityMusic(delta) {

  if(musicPaused) return;

  let nearest=-1;
  let nearestDistance=Infinity;

  for(let i=0;i<photoPositions.length;i++) {

    const distance=camera.position.distanceTo(
      photoPositions[i]
    );

    if(distance<nearestDistance) {
      nearestDistance=distance;
      nearest=i;
    }
  }

  // Outer and inner music distances

  const outerDistance=34;
  const fullVolumeDistance=11;

  if(nearest>=0 && nearestDistance<outerDistance) {

    if(nearest!==currentAudioIndex) {
      startMusic(nearest);
    }

    const fade=THREE.MathUtils.clamp(
      (outerDistance-nearestDistance)/
      (outerDistance-fullVolumeDistance),
      0,1
    );

    const target=fade*fade*(3-2*fade);

    if(currentAudio) {
      currentAudio.volume=THREE.MathUtils.damp(
        currentAudio.volume,
        target,
        2.2,
        delta
      );
    }

    if(nearestDistance<outerDistance) {
      activeInstallation=nearest;
    }

    updateStatus();

  } else {

    if(currentAudio) {
      currentAudio.volume=THREE.MathUtils.damp(
        currentAudio.volume,0,2.2,delta
      );

      if(currentAudio.volume<.015) {
        currentAudio.pause();
        currentAudio.currentTime=0;
        currentAudio=null;
        currentAudioIndex=-1;
      }
    }
  }

  // Fade out previously playing tracks

  for(let i=fadingAudios.length-1;i>=0;i--) {

    const old=fadingAudios[i];

    old.volume=THREE.MathUtils.damp(
      old.volume,0,3,delta
    );

    if(old.volume<.015) {
      old.pause();
      old.src="";
      fadingAudios.splice(i,1);
    }
  }
}

// --------------------------------------------------
// MUSIC BUTTON
// --------------------------------------------------

function toggleMusic() {

  musicPaused=!musicPaused;

  if(musicPaused) {

    if(currentAudio) currentAudio.pause();

    fadingAudios.forEach(a=>a.pause());

    document.getElementById("audioButton").textContent=
      "Play music";

  } else {

    if(currentAudio) {
      currentAudio.play().catch(()=>{});
    }

    document.getElementById("audioButton").textContent=
      "Pause music";
  }
}

document.getElementById("audioButton")
  .addEventListener("click",toggleMusic);

// --------------------------------------------------
// LIGHTING
// --------------------------------------------------

function updateLighting(delta) {

  displayLights.forEach((light,i)=>{

    const distance=camera.position.distanceTo(
      photoPositions[i]
    );

    const target=distance<38
      ? 5.5*Math.max(0,1-distance/38)
      : 0;

    light.intensity=THREE.MathUtils.damp(
      light.intensity,target,2.5,delta
    );
  });

  endingLight.intensity=THREE.MathUtils.damp(
    endingLight.intensity,
    progress>.88?4:2.5,
    1.5,
    delta
  );
}

// --------------------------------------------------
// KEYBOARD CONTROLS
// --------------------------------------------------

addEventListener("keydown",e=>{

  keys[e.code]=true;

  if([
    "ArrowUp","ArrowDown",
    "ArrowLeft","ArrowRight","Space"
  ].includes(e.code)) {
    e.preventDefault();
  }

  const turn=.045;

  if(e.code==="ArrowLeft") lookYaw+=turn;
  if(e.code==="ArrowRight") lookYaw-=turn;

  if(e.code==="ArrowUp") {
    lookPitch=Math.max(-.65,lookPitch-turn);
  }

  if(e.code==="ArrowDown") {
    lookPitch=Math.min(.65,lookPitch+turn);
  }
});

addEventListener("keyup",e=>{
  keys[e.code]=false;
});

// --------------------------------------------------
// MOUSE AND TRACKPAD LOOKING
// --------------------------------------------------

let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{

  if(e.pointerType==="mouse" || e.pointerType==="pen") {

    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;

    renderer.domElement.setPointerCapture(e.pointerId);
  }
});

renderer.domElement.addEventListener("pointermove",e=>{

  if(!dragging) return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lookYaw-=dx*.004;

  lookPitch=THREE.MathUtils.clamp(
    lookPitch+dy*.004,-.65,.65
  );

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener("pointerup",()=>{
  dragging=false;
});

renderer.domElement.addEventListener("pointercancel",()=>{
  dragging=false;
});

// --------------------------------------------------
// IPAD TOUCH LOOKING
// --------------------------------------------------

let touchLook=null;

renderer.domElement.addEventListener("touchstart",e=>{

  if(e.touches.length===1) {
    touchLook={
      x:e.touches[0].clientX,
      y:e.touches[0].clientY
    };
  }

},{passive:true});

renderer.domElement.addEventListener("touchmove",e=>{

  if(!touchLook || e.touches.length!==1) return;

  const t=e.touches[0];

  const dx=t.clientX-touchLook.x;
  const dy=t.clientY-touchLook.y;

  lookYaw-=dx*.005;

  lookPitch=THREE.MathUtils.clamp(
    lookPitch+dy*.005,-.65,.65
  );

  touchLook={
    x:t.clientX,
    y:t.clientY
  };

},{passive:true});

renderer.domElement.addEventListener("touchend",()=>{
  touchLook=null;
});

// --------------------------------------------------
// ON-SCREEN MOVEMENT BUTTONS
// --------------------------------------------------

document.querySelectorAll("[data-move]").forEach(button=>{

  const direction=button.dataset.move;

  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    held[direction]=true;
  });

  ["pointerup","pointerleave","pointercancel"].forEach(event=>{
    button.addEventListener(event,()=>{
      held[direction]=false;
    });
  });
});

// --------------------------------------------------
// ENTER THE GALLERY
// --------------------------------------------------

document.getElementById("enterButton")
  .addEventListener("click",()=>{

    entered=true;

    document.getElementById("enter").style.display="none";

    updateCamera();
  });

// --------------------------------------------------
// MAIN ANIMATION
// --------------------------------------------------

function animate() {

  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);

  updatePlayer(delta);
  updateInstallations();
  updateCamera();

  updateProximityMusic(delta);
  updateLighting(delta);

  renderer.render(scene,camera);
}

animate();

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
