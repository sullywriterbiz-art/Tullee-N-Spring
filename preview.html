
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tullee & Spring — HorseHills</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171512;
  font-family: Georgia, serif;
}

#room {
  position: fixed;
  inset: 0;
}

#instructions {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #f5eee2;
  background: rgba(20,18,15,.72);
  padding: 9px 15px;
  border-radius: 5px;
  font-size: 13px;
  text-align: center;
  z-index: 5;
  pointer-events: none;
  max-width: 90%;
}

#enter {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(12,11,9,.82);
  color: #f7eee0;
  text-align: center;
  padding: 24px;
}

#enter button, #poem button, #music button {
  font-family: Georgia, serif;
  cursor: pointer;
  border: 1px solid #c5ad85;
  background: #44382b;
  color: #fff4e2;
  padding: 11px 18px;
  border-radius: 4px;
  font-size: 16px;
}

#enter h1 {
  font-weight: normal;
  letter-spacing: 2px;
  font-size: 30px;
}

#enter p {
  line-height: 1.6;
  max-width: 340px;
  margin: 18px auto 24px;
}

#music {
  position: fixed;
  bottom: 14px;
  right: 14px;
  z-index: 8;
}

#music button {
  font-size: 13px;
  padding: 9px 13px;
  background: rgba(35,29,23,.85);
}

#poem {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.92);
  padding: 20px;
}

#poemContent {
  max-width: 95vw;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#poemImage {
  max-width: 92vw;
  max-height: 78vh;
  object-fit: contain;
  transform-origin: center;
}

#poemControls {
  display: flex;
  gap: 10px;
}

#poemControls button {
  font-size: 14px;
  padding: 8px 13px;
}

#mobileControls {
  position: fixed;
  bottom: 16px;
  left: 14px;
  z-index: 10;
  display: none;
  grid-template-columns: 48px 48px 48px;
  grid-template-rows: 42px 42px;
  gap: 4px;
  touch-action: none;
}

#mobileControls button {
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 7px;
  background: rgba(35,29,23,.65);
  color: white;
  font-size: 20px;
  touch-action: none;
}

#mobileControls .up { grid-column: 2; }
#mobileControls .left { grid-column: 1; grid-row: 2; }
#mobileControls .down { grid-column: 2; grid-row: 2; }
#mobileControls .right { grid-column: 3; grid-row: 2; }

@media (pointer: coarse) {
  #mobileControls { display: grid; }
  #instructions { top: 8px; font-size: 11px; }
}
</style>
</head>

<body>

<div id="room"></div>

<div id="instructions">
  Drag to look around · Use arrows or WASD to move · Tap the poem to read
</div>

<div id="enter">
  <div>
    <h1>Tullee &amp; Spring</h1>
    <p>HorseHills</p>
    <p>Enter the room, take your time, and enjoy the photograph, poem, and music.</p>
    <button id="enterButton">Enter Room</button>
  </div>
</div>

<div id="music">
  <button id="musicButton">Pause Music</button>
</div>

<div id="mobileControls">
  <button class="up" data-move="forward">▲</button>
  <button class="left" data-move="left">◀</button>
  <button class="down" data-move="back">▼</button>
  <button class="right" data-move="right">▶</button>
</div>

<div id="poem">
  <div id="poemContent">
    <img id="poemImage" src="HorseHills.png" alt="HorseHills poem">
    <div id="poemControls">
      <button id="zoomOut">−</button>
      <button id="zoomIn">+</button>
      <button id="closePoem">Close</button>
    </div>
  </div>
</div>

<audio id="song" src="horsehills.mp3" loop preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
  const container = document.getElementById("room");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x26221d);

  const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.set(0, 1.65, 6);
  camera.rotation.order = "YXZ";

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));

  const roomLight = new THREE.PointLight(0xffe4bd, 65, 35);
  roomLight.position.set(0, 5.5, 1);
  scene.add(roomLight);

  // Room dimensions
  const roomWidth = 18;
  const roomDepth = 18;
  const roomHeight = 7;

  const wallMaterial = new THREE.MeshStandardMaterial({
    color: 0xb9aa95,
    roughness: 0.9
  });

  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(roomWidth, roomDepth),
    new THREE.MeshStandardMaterial({
      color: 0x805b3d,
      roughness: 0.72
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  scene.add(floor);

  // Simple hardwood floorboards
  const boardMaterial = new THREE.MeshStandardMaterial({
    color: 0x68472f,
    roughness: 0.85
  });

  for (let z = -8.5; z <= 8.5; z += 0.55) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(roomWidth, 0.012, 0.018),
      boardMaterial
    );
    line.position.set(0, 0.012, z);
    scene.add(line);
  }

  // Side walls
  const leftWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, roomHeight, roomDepth),
    wallMaterial
  );
  leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
  scene.add(leftWall);

  const rightWall = leftWall.clone();
  rightWall.position.x = roomWidth / 2;
  scene.add(rightWall);

  // Back wall
  const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(roomWidth, roomHeight, 0.2),
    wallMaterial
  );
  backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
  scene.add(backWall);

  // Front wall
  const frontWall = backWall.clone();
  frontWall.position.z = roomDepth / 2;
  scene.add(frontWall);

  // Ceiling
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(roomWidth, roomDepth),
    new THREE.MeshStandardMaterial({
      color: 0x8c8071,
      roughness: 1
    })
  );
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = roomHeight;
  scene.add(ceiling);

  // Load artwork
  const loader = new THREE.TextureLoader();

  function loadTexture(filename, callback) {
    loader.load(
      filename,
      texture => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        callback(texture);
      },
      undefined,
      () => console.warn("Could not load image:", filename)
    );
  }

  // Framed photograph on the back wall
  function addFrame(x, y, width, height, texture, isPoem) {
    const frame = new THREE.Group();
    frame.position.set(x, y, -8.82);
    scene.add(frame);

    const outer = new THREE.Mesh(
      new THREE.BoxGeometry(width + 0.24, height + 0.24, 0.16),
      new THREE.MeshStandardMaterial({
        color: 0x39291d,
        roughness: 0.55
      })
    );
    frame.add(outer);

    const inner = new THREE.Mesh(
      new THREE.BoxGeometry(width + 0.08, height + 0.08, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xc5ad85,
        roughness: 0.65
      })
    );
    inner.position.z = 0.095;
    frame.add(inner);

    const picture = new THREE.Mesh(
      new THREE.PlaneGeometry(width, height),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      })
    );
    picture.position.z = 0.15;
    frame.add(picture);

    if (isPoem) {
      picture.userData.isPoem = true;
      poemObjects.push(picture);
    }

    return frame;
  }

  const poemObjects = [];

  loadTexture("HorseHills.jpg", texture => {
    addFrame(-2.25, 3.0, 5.0, 3.25, texture, false);
  });

  loadTexture("HorseHills.png", texture => {
    addFrame(3.15, 2.8, 2.4, 3.4, texture, true);
  });

  // Camera movement and looking
  let yaw = 0;
  let pitch = 0;
  const keys = {};
  const moveSpeed = 0.055;
  const lookSpeed = 0.004;

  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  renderer.domElement.addEventListener("pointerdown", event => {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
    renderer.domElement.setPointerCapture(event.pointerId);
  });

  renderer.domElement.addEventListener("pointermove", event => {
    if (!dragging) return;

    const dx = event.clientX - lastX;
    const dy = event.clientY - lastY;

    yaw -= dx * lookSpeed;
    pitch -= dy * lookSpeed;

    pitch = Math.max(-0.65, Math.min(0.65, pitch));

    lastX = event.clientX;
    lastY = event.clientY;
  });

  function stopDragging() {
    dragging = false;
  }

  renderer.domElement.addEventListener("pointerup", stopDragging);
  renderer.domElement.addEventListener("pointercancel", stopDragging);

  window.addEventListener("keydown", event => {
    keys[event.key.toLowerCase()] = true;

    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
      event.preventDefault();
    }
  });

  window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
  });

  // Mobile movement buttons
  const heldMoves = {};

  document.querySelectorAll("[data-move]").forEach(button => {
    const direction = button.dataset.move;

    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      heldMoves[direction] = true;
      button.setPointerCapture(event.pointerId);
    });

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
      button.addEventListener(type, () => {
        heldMoves[direction] = false;
      });
    });
  });

  function updateMovement() {
    let forward = 0;
    let sideways = 0;

    if (keys["w"] || keys["arrowup"] || heldMoves.forward) forward += 1;
    if (keys["s"] || keys["arrowdown"] || heldMoves.back) forward -= 1;
    if (keys["a"] || heldMoves.left) sideways -= 1;
    if (keys["d"] || heldMoves.right) sideways += 1;

    const length = Math.hypot(forward, sideways);
    if (length === 0) return;

    forward /= length;
    sideways /= length;

    camera.position.x +=
      (Math.sin(yaw) * forward + Math.cos(yaw) * sideways) * moveSpeed;

    camera.position.z +=
      (-Math.cos(yaw) * forward + Math.sin(yaw) * sideways) * moveSpeed;

    // Keep the visitor inside the room
    camera.position.x = THREE.MathUtils.clamp(
      camera.position.x, -8.0, 8.0
    );

    camera.position.z = THREE.MathUtils.clamp(
      camera.position.z, -8.0, 8.0
    );
  }

  // Tap the poem to enlarge it
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  renderer.domElement.addEventListener("click", event => {
    if (dragging || poemObjects.length === 0) return;

    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(poemObjects);

    if (hits.length > 0) {
      openPoem();
    }
  });

  // Poem enlargement
  const poemOverlay = document.getElementById("poem");
  const poemImage = document.getElementById("poemImage");
  let zoom = 1;

  function openPoem() {
    zoom = 1;
    poemImage.style.transform = "scale(1)";
    poemOverlay.style.display = "flex";
  }

  document.getElementById("closePoem").addEventListener("click", () => {
    poemOverlay.style.display = "none";
  });

  document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = Math.min(zoom + 0.2, 2.5);
    poemImage.style.transform = `scale(${zoom})`;
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = Math.max(zoom - 0.2, 0.6);
    poemImage.style.transform = `scale(${zoom})`;
  });

  poemOverlay.addEventListener("click", event => {
    if (event.target === poemOverlay) {
      poemOverlay.style.display = "none";
    }
  });

  // Music
  const song = document.getElementById("song");
  const musicButton = document.getElementById("musicButton");

  document.getElementById("enterButton").addEventListener("click", async () => {
    document.getElementById("enter").style.display = "none";

    try {
      await song.play();
      musicButton.textContent = "Pause Music";
    } catch (error) {
      musicButton.textContent = "Play Music";
    }
  });

  musicButton.addEventListener("click", async () => {
    if (song.paused) {
      try {
        await song.play();
        musicButton.textContent = "Pause Music";
      } catch (error) {
        musicButton.textContent = "Play Music";
      }
    } else {
      song.pause();
      musicButton.textContent = "Play Music";
    }
  });

  // Main animation
  function animate() {
    requestAnimationFrame(animate);

    updateMovement();

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    renderer.render(scene, camera);
  }

  animate();

  // Resize
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>

</body>
</html>
