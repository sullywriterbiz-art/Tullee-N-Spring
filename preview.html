
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tullee &amp; Spring — HorseHills</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;font-family:Georgia,serif}
canvas{display:block;touch-action:none}
#heading{position:fixed;z-index:4;top:14px;left:16px;color:#f1e8d8;font:12px Arial,sans-serif;letter-spacing:.14em;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:fixed;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);max-width:90vw;padding:8px 12px;border-radius:18px;background:rgba(25,22,18,.76);color:#eee3d0;font:12px Arial,sans-serif;text-align:center;pointer-events:none}
button{font:14px Arial,sans-serif;color:#f7eddd;background:#55452f;border:1px solid #b69b70;border-radius:22px;padding:10px 15px;cursor:pointer;touch-action:manipulation}
#enter,#poemModal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(12,11,9,.82)}
#enterCard{max-width:440px;padding:28px 26px;text-align:center;color:#f3eadb;background:rgba(34,29,23,.97);border:1px solid #a78c62;border-radius:8px}
#enterCard h1{margin:0 0 12px;font-weight:normal;font-size:clamp(25px,5vw,36px)}
#enterCard p{line-height:1.55;color:#ddd1bd}
#enterButton{margin-top:8px;padding:12px 24px}
#musicButton{position:fixed;z-index:7;right:14px;bottom:14px;background:rgba(42,34,25,.9);font-size:12px}
#readPoem{position:fixed;z-index:7;right:14px;top:14px;background:rgba(42,34,25,.9);font-size:12px}
#musicStatus{position:fixed;z-index:7;right:14px;bottom:58px;color:#f1e8d8;font:11px Arial,sans-serif;text-shadow:0 1px 5px #000;pointer-events:none}
#poemModal{display:none;background:rgba(8,7,6,.95);z-index:20;flex-direction:column;gap:12px}
#poemImage{display:block;max-width:94vw;max-height:82vh;object-fit:contain;background:#eee8da;box-shadow:0 8px 35px #000}
#closePoem{align-self:flex-end;margin-right:2vw}
#touchControls{position:fixed;z-index:6;left:14px;bottom:56px;display:none;gap:8px;align-items:center;user-select:none;-webkit-user-select:none}
#touchControls button{width:48px;height:48px;padding:0;border-radius:50%;font-size:20px;background:rgba(42,35,27,.82)}
#touchControls .stack{display:flex;flex-direction:column;gap:7px}
@media(pointer:coarse){#touchControls{display:flex}#hint{bottom:12px;left:auto;right:12px;transform:none;max-width:48vw}#musicButton{bottom:14px;right:12px}#musicStatus{right:12px;bottom:58px}}
</style>
</head>
<body>
<div id="heading">TULLEE &amp; SPRING · INSTALLATION 1</div>
<div id="hint">Drag to look · Use arrows or WASD to move · Tap Read poem</div>
<div id="touchControls" aria-label="Room movement controls">
  <div class="stack"><button data-move="forward" aria-label="Forward">↑</button><button data-move="back" aria-label="Back">↓</button></div>
  <div class="stack"><button data-move="left" aria-label="Left">←</button><button data-move="right" aria-label="Right">→</button></div>
</div>
<button id="readPoem">Read poem</button>
<div id="musicStatus">Music ready</div>
<button id="musicButton">Play music</button>
<div id="enter"><div id="enterCard"><h1>Tullee &amp; Spring</h1><p>HorseHills</p><p>Enter the room, take a look around, and spend a little time with the photograph and poem.</p><button id="enterButton">Enter the room</button></div></div>
<div id="poemModal"><button id="closePoem">Close poem</button><img id="poemImage" src="HorseHills.png" alt="HorseHills poem"></div>
<audio id="roomSong" src="horsehills.mp3" preload="auto" loop playsinline></audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const hint=document.getElementById('hint');
if(!window.THREE){hint.textContent='The 3D library did not load. Please reload while connected to the internet.';return;}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x29231c);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,6.4);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.88;
document.body.appendChild(renderer.domElement);

// Room: same dimensions and simple layout, with a richer, traditional hardwood floor.
const room=new THREE.Group();scene.add(room);
const wallMat=new THREE.MeshStandardMaterial({color:0xbeb4a5,roughness:1});
const sideMat=new THREE.MeshStandardMaterial({color:0xb3a796,roughness:1});
const ceilingMat=new THREE.MeshStandardMaterial({color:0xc8bfae,roughness:1});
function panel(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);room.add(m);return m;}
panel(18,.22,16,ceilingMat,0,6.2,0);
panel(18,6.2,.22,wallMat,0,3,-8);
panel(18,6.2,.22,sideMat,0,3,8);
panel(.22,6.2,16,sideMat,-9,3,0);
panel(.22,6.2,16,sideMat,9,3,0);

// Make a warm oak floor texture in the browser: varied boards, grain, knots and fine seams.
function makeHardwoodTexture(){
  const c=document.createElement('canvas');c.width=1536;c.height=1024;
  const g=c.getContext('2d');
  const plankH=128;
  const colors=['#70472d','#815638','#795033','#8b603f','#6e452c','#845737','#754a30','#906442'];
  for(let row=0;row<8;row++){
    const y=row*plankH;
    g.fillStyle='#302116';g.fillRect(0,y,1536,plankH);
    let x=0;const offset=(row%2)*150;
    while(x<1536){
      const w=260+((row*73+Math.floor(x/13)*29)%180);
      g.fillStyle=colors[(row+Math.floor(x/100))%colors.length];
      g.fillRect(x+2,y+2,w-4,plankH-4);
      const grad=g.createLinearGradient(0,y,0,y+plankH);
      grad.addColorStop(0,'rgba(255,218,164,.12)');
      grad.addColorStop(.45,'rgba(30,13,5,.02)');
      grad.addColorStop(1,'rgba(18,8,3,.25)');
      g.fillStyle=grad;g.fillRect(x+2,y+2,w-4,plankH-4);
      for(let k=0;k<13;k++){
        const yy=y+12+k*8+(row%3)*2;
        g.beginPath();g.moveTo(x+8,yy);
        g.bezierCurveTo(x+w*.28,yy-5+(k%3)*3,x+w*.66,yy+4-(k%4)*2,x+w-8,yy-2);
        g.strokeStyle=k%3===0?'rgba(38,17,7,.25)':'rgba(235,190,130,.10)';
        g.lineWidth=k%4===0?2:1;g.stroke();
      }
      if((row+Math.floor(x/100))%4===0){
        const kx=x+w*.55,ky=y+plankH*.52;
        g.beginPath();g.ellipse(kx,ky,17,6,-.12,0,Math.PI*2);
        g.strokeStyle='rgba(35,15,6,.38)';g.lineWidth=2;g.stroke();
        g.beginPath();g.ellipse(kx,ky,8,3,-.12,0,Math.PI*2);
        g.strokeStyle='rgba(35,15,6,.3)';g.lineWidth=1;g.stroke();
      }
      x+=w;
    }
    g.fillStyle='rgba(30,16,9,.48)';g.fillRect(0,y+plankH-2,1536,3);
    let joint=offset;
    while(joint<1536){g.fillStyle='rgba(32,17,9,.65)';g.fillRect(joint,y+2,3,plankH-4);joint+=430;}
  }
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(1,1);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,16),new THREE.MeshStandardMaterial({map:makeHardwoodTexture(),roughness:.62,metalness:0}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.005;floor.receiveShadow=true;room.add(floor);

// Softer, warmer lighting than the first test.
scene.add(new THREE.HemisphereLight(0xffecd2,0x514438,.62));
const mainLight=new THREE.DirectionalLight(0xffe6c4,.52);mainLight.position.set(-3,8,5);scene.add(mainLight);
const fillLight=new THREE.PointLight(0xffdcae,13,22,2);fillLight.position.set(0,4.7,-3.5);scene.add(fillLight);

// Artwork frames: the image plane sits clearly in front of the frame, so it cannot be covered.
const frameMat=new THREE.MeshStandardMaterial({color:0x382719,roughness:.48,metalness:.08});
const brassMat=new THREE.MeshStandardMaterial({color:0xb69a6b,roughness:.45,metalness:.25});
const loader=new THREE.TextureLoader();
const poemTargets=[];
function addFramedArtwork(file,x,y,w,h,isPoem){
  const group=new THREE.Group();group.position.set(x,y,-7.78);room.add(group);
  const backing=new THREE.Mesh(new THREE.BoxGeometry(w+.34,h+.34,.18),frameMat);group.add(backing);
  const mat=new THREE.MeshBasicMaterial({color:isPoem?0xece5d8:0x6f675b,side:THREE.DoubleSide});
  const image=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);image.position.z=.145;group.add(image);
  const rail=.055,depth=.07,z=.13;
  const rails=[
    [w+.12,rail,depth,0,h/2+.035,z],
    [w+.12,rail,depth,0,-h/2-.035,z],
    [rail,h,depth,-w/2-.035,0,z],
    [rail,h,depth,w/2+.035,0,z]
  ];
  rails.forEach(([rw,rh,rd,rx,ry,rz])=>{
    const r=new THREE.Mesh(new THREE.BoxGeometry(rw,rh,rd),brassMat);
    r.position.set(rx,ry,rz);group.add(r);
  });
  loader.load(file,texture=>{
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
    mat.map=texture;mat.color.set(0xffffff);mat.needsUpdate=true;
  },undefined,()=>{
    console.warn('Image could not be loaded: '+file);
    if(isPoem)hint.textContent='Poem image not found — check that HorseHills.png is beside preview.html';
  });
  if(isPoem)poemTargets.push(image);
  return image;
}
addFramedArtwork('HorseHills.jpg',-2.45,3.05,5.15,3.35,false);
addFramedArtwork('HorseHills.png',3.15,3.0,2.8,3.8,true);

// Slow, bounded movement. Navigation is unchanged from the working room.
const held={forward:false,back:false,left:false,right:false},keys={};
let yaw=0,pitch=0,dragging=false,lastX=0,lastY=0,entered=false;
const clock=new THREE.Clock();
function update(dt){
  const turn=.72*dt;
  if(keys.ArrowLeft||held.left)yaw+=turn;
  if(keys.ArrowRight||held.right)yaw-=turn;
  const speed=1.05*dt;let forward=0;
  if(keys.KeyW||keys.ArrowUp||held.forward)forward+=speed;
  if(keys.KeyS||keys.ArrowDown||held.back)forward-=speed;
  if(forward){
    camera.position.x-=Math.sin(yaw)*forward;
    camera.position.z-=Math.cos(yaw)*forward;
  }
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7.4,7.4);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-6.7,6.7);
  camera.rotation.set(pitch,yaw,0,'YXZ');
}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||e.pointerType==='pen'){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  yaw-=dx*.0015;
  pitch=THREE.MathUtils.clamp(pitch+dy*.0012,-.38,.38);
  lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
let touchLook=null;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1)touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(!touchLook||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-touchLook.x,dy=t.clientY-touchLook.y;
  yaw-=dx*.0018;
  pitch=THREE.MathUtils.clamp(pitch+dy*.0012,-.38,.38);
  touchLook={x:t.clientX,y:t.clientY};
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>touchLook=null);
document.querySelectorAll('[data-move]').forEach(b=>{
  const d=b.dataset.move;
  b.addEventListener('pointerdown',e=>{e.preventDefault();held[d]=true;});
  ['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(ev=>
    b.addEventListener(ev,()=>held[d]=false)
  );
});

// Open the poem from either the framed image or the always-visible Read poem button.
const modal=document.getElementById('poemModal');
function openPoem(){modal.style.display='flex';}
document.getElementById('readPoem').addEventListener('click',openPoem);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
  if(!entered||dragging||!poemTargets.length)return;
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  if(raycaster.intersectObjects(poemTargets).length)openPoem();
});
document.getElementById('closePoem').addEventListener('click',()=>modal.style.display='none');
modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none';});
document.getElementById('poemImage').addEventListener('error',()=>{
  hint.textContent='Poem file not found — check the spelling of HorseHills.png';
});

// Start music from the visitor's tap, and keep a separate play/pause button available.
const song=document.getElementById('roomSong');
const musicButton=document.getElementById('musicButton');
const musicStatus=document.getElementById('musicStatus');
async function playSong(){
  try{
    await song.play();
    musicButton.textContent='Pause music';
    musicStatus.textContent='Music playing';
  }catch(err){
    musicButton.textContent='Play music';
    musicStatus.textContent='Tap Play music to start';
    console.warn('Audio playback did not start:',err);
  }
}
function pauseSong(){
  song.pause();
  musicButton.textContent='Play music';
  musicStatus.textContent='Music paused';
}
document.getElementById('enterButton').addEventListener('click',()=>{
  entered=true;
  document.getElementById('enter').style.display='none';
  playSong();
});
musicButton.addEventListener('click',()=>{if(song.paused)playSong();else pauseSong();});
song.addEventListener('error',()=>{
  musicStatus.textContent='Song file not found — check horsehills.mp3';
  musicButton.textContent='Play music';
});
song.addEventListener('ended',()=>{musicStatus.textContent='Music ended';});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(entered)update(dt);
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
