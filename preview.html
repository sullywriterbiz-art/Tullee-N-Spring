
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tullee and Spring — HorseHills</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17120e;
  font-family:Georgia,serif;
}

canvas{display:block;touch-action:none}

#heading{
  position:fixed;
  top:18px;
  left:22px;
  z-index:5;
  color:#eee4d3;
  font:13px Arial,sans-serif;
  letter-spacing:2px;
  text-shadow:0 2px 5px #000;
}

#hint{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#eee4d3;
  background:#211c17cc;
  padding:10px 16px;
  border-radius:20px;
  font:12px Arial,sans-serif;
  text-align:center;
  white-space:nowrap;
}

#enter,#poemModal{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#100d0bc9;
  padding:20px;
}

#enterCard{
  background:#292219;
  border:1px solid #b49a70;
  color:#f1e6d5;
  padding:35px;
  text-align:center;
  max-width:400px;
}

#enterCard h1{
  font-weight:normal;
  letter-spacing:2px;
}

button{
  background:#665039;
  color:#fff1dc;
  border:1px solid #c2a77c;
  border-radius:22px;
  padding:12px 22px;
  cursor:pointer;
  font-size:14px;
}

#poemModal{
  display:none;
  z-index:20;
  flex-direction:column;
  justify-content:flex-start;
  overflow-y:auto;
  background:#080706f5;
}

#closePoem{
  position:sticky;
  top:0;
  align-self:flex-end;
  flex-shrink:0;
}

#poemImage{
  display:block;
  width:auto;
  max-width:94vw;
  height:auto;
  max-height:none;
  object-fit:contain;
  margin:10px auto 25px;
}

#touchControls{
  display:none;
  position:fixed;
  bottom:60px;
  left:15px;
  z-index:6;
  gap:8px;
}

#touchControls button{
  width:48px;
  height:48px;
  padding:0;
  border-radius:50%;
}

@media(pointer:coarse){
  #touchControls{display:flex}
  #hint{
    left:auto;
    right:10px;
    transform:none;
    white-space:normal;
    max-width:48vw;
  }
}
</style>
</head>

<body>

<div id="heading">TULLEE AND SPRING · HORSEHILLS</div>

<div id="hint">
  WASD or arrows to walk · Drag to look · Tap poem to enlarge
</div>

<div id="touchControls">
  <button data-move="forward">↑</button>
  <button data-move="back">↓</button>
  <button data-move="left">←</button>
  <button data-move="right">→</button>
</div>

<div id="enter">
  <div id="enterCard">
    <h1>Tullee and Spring</h1>
    <p>HorseHills</p>
    <button id="enterButton">ENTER ROOM</button>
  </div>
</div>

<div id="poemModal">
  <button id="closePoem">Close poem</button>
  <img id="poemImage"
       src="assets/poem/HorseHills.png"
       alt="HorseHills poem">
</div>

<audio id="roomSong"
       src="assets/music/horse hills.mp3"
       preload="auto"
       loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(()=>{
'use strict';

/* SCENE */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x211b15);

const camera=new THREE.PerspectiveCamera(
  62,innerWidth/innerHeight,.1,100
);

camera.position.set(0,1.65,4.5);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* ROOM SIZE: 14 x 12 x 6.4 */

const room=new THREE.Group();
scene.add(room);

const wallMat=new THREE.MeshStandardMaterial({
  color:0x827767,
  roughness:.95
});

const sideMat=new THREE.MeshStandardMaterial({
  color:0x665b4c,
  roughness:.95
});

const ceilingMat=new THREE.MeshStandardMaterial({
  color:0x9b907e,
  roughness:1
});

function panel(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),mat
  );
  m.position.set(x,y,z);
  room.add(m);
  return m;
}


/* HARDWOOD FLOOR */

const floorTexture=new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/hardwood2_diffuse.jpg"
);

floorTexture.colorSpace=THREE.SRGBColorSpace;
floorTexture.wrapS=THREE.RepeatWrapping;
floorTexture.wrapT=THREE.RepeatWrapping;
floorTexture.repeat.set(5,4);

const floorMat=new THREE.MeshStandardMaterial({
  map:floorTexture,
  roughness:.62
});

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(14,12),
  floorMat
);

floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
room.add(floor);


/* WALLS AND CEILING */

panel(14,.2,12,ceilingMat,0,6.5,0);

panel(14,6.4,.2,wallMat,0,3.2,-6);

panel(.2,6.4,12,sideMat,-7,3.2,0);
panel(.2,6.4,12,sideMat,7,3.2,0);

/* Entrance wall with open doorway */

panel(5.3,6.4,.2,sideMat,-4.35,3.2,6);
panel(5.3,6.4,.2,sideMat,4.35,3.2,6);
panel(3.4,.8,.2,sideMat,0,6,6);


/* LIGHTING */

scene.add(new THREE.HemisphereLight(
  0xffedda,0x55483a,1.6
));

const mainLight=new THREE.DirectionalLight(
  0xffe5c4,2
);

mainLight.position.set(-3,6,4);
scene.add(mainLight);

/* Warm room illumination */

const roomLight=new THREE.PointLight(
  0xffd9a6,65,17,2
);

roomLight.position.set(0,4.8,0);
scene.add(roomLight);

/* Brighter photograph illumination */

const photoLight=new THREE.PointLight(
  0xffe5bd,85,10,2
);

photoLight.position.set(-2.5,4.8,-3.8);
scene.add(photoLight);

/* Softer poem illumination */

const poemLight=new THREE.PointLight(
  0xffe5c4,48,8,2
);

poemLight.position.set(2.7,4.5,-3.5);
scene.add(poemLight);


/* PICTURE AND POEM FRAMES */

const frameMat=new THREE.MeshStandardMaterial({
  color:0x493723,
  roughness:.5
});

const innerMat=new THREE.MeshStandardMaterial({
  color:0xe7ddc8,
  roughness:.9
});

function framedImage(src,x,y,w,h){

  const group=new THREE.Group();

  group.position.set(x,y,-5.78);
  room.add(group);

  const backing=new THREE.Mesh(
    new THREE.BoxGeometry(w+.34,h+.34,.18),
    frameMat
  );

  group.add(backing);

  const mat=new THREE.MeshBasicMaterial({
    color:0xffffff
  });

  const image=new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    mat
  );

  image.position.z=.105;
  group.add(image);

  const trim=new THREE.Mesh(
    new THREE.BoxGeometry(w+.08,h+.08,.035),
    innerMat
  );

  trim.position.z=.075;
  group.add(trim);

  const loader=new THREE.TextureLoader();

  loader.load(src,t=>{
    t.colorSpace=THREE.SRGBColorSpace;
    mat.map=t;
    mat.needsUpdate=true;
  },undefined,()=>{
    console.error("Could not load image:",src);
  });

  image.renderOrder=2;

  return {group,image};
}


/* HORSEHILLS PHOTOGRAPH */

const photo=framedImage(
  "assets/photos/HorseHills.jpg",
  -2.55,3.1,4.7,3.0
);


/* HORSEHILLS POEM */

const poem=framedImage(
  "assets/poem/HorseHills.png",
  2.65,3.1,2.8,3.9
);


/* MOVEMENT */

const keys={};
const held={
  forward:false,
  back:false,
  left:false,
  right:false
};

let yaw=0;
let pitch=0;
let dragging=false;
let movedPointer=false;
let lastX=0;
let lastY=0;
let entered=false;

const clock=new THREE.Clock();

function update(dt){

  const turn=.85*dt;
  const speed=1.4*dt;

  if(keys.ArrowLeft||keys.KeyA||held.left)yaw+=turn;
  if(keys.ArrowRight||keys.KeyD||held.right)yaw-=turn;

  let forward=0;

  if(keys.KeyW||keys.ArrowUp||held.forward)forward+=speed;
  if(keys.KeyS||keys.ArrowDown||held.back)forward-=speed;

  camera.position.x-=Math.sin(yaw)*forward;
  camera.position.z-=Math.cos(yaw)*forward;

  camera.position.x=THREE.MathUtils.clamp(
    camera.position.x,-5.8,5.8
  );

  camera.position.z=THREE.MathUtils.clamp(
    camera.position.z,-4.8,4.8
  );

  camera.rotation.set(pitch,yaw,0,'YXZ');
}

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code.startsWith('Arrow'))e.preventDefault();
});

addEventListener('keyup',e=>{
  keys[e.code]=false;
});


/* LOOK CONTROLS */

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||e.pointerType==='pen'){
    dragging=true;
    movedPointer=false;
    lastX=e.clientX;
    lastY=e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  if(Math.abs(dx)+Math.abs(dy)>2)movedPointer=true;

  yaw-=dx*.0015;

  pitch=THREE.MathUtils.clamp(
    pitch+dy*.0012,-.38,.38
  );

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',()=>{
  dragging=false;
});

renderer.domElement.addEventListener('pointercancel',()=>{
  dragging=false;
});


/* TOUCH MOVEMENT */

document.querySelectorAll('[data-move]').forEach(b=>{

  const direction=b.dataset.move;

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    held[direction]=true;
  });

  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    b.addEventListener(ev,()=>held[direction]=false);
  });

});


/* ENLARGE POEM */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('click',e=>{

  if(dragging||movedPointer||!entered)return;

  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(pointer,camera);

  if(raycaster.intersectObject(poem.image).length){
    document.getElementById('poemModal').style.display='flex';
  }

  movedPointer=false;
});

document.getElementById('closePoem').addEventListener('click',()=>{
  document.getElementById('poemModal').style.display='none';
});

document.getElementById('poemModal').addEventListener('click',e=>{
  if(e.target.id==='poemModal'){
    e.currentTarget.style.display='none';
  }
});


/* MUSIC */

const song=document.getElementById('roomSong');
song.loop=true;

document.getElementById('enterButton').addEventListener('click',()=>{

  entered=true;

  document.getElementById('enter').style.display='none';

  song.play().catch(()=>{
    document.getElementById('hint').textContent=
      'Tap ENTER again to start the music if playback is blocked.';
  });

});


/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);

  if(entered)update(dt);

  renderer.render(scene,camera);
}

animate();


/* RESIZE */

addEventListener('resize',()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

});

})();
</script>

</body>
</html>
